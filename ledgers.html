:root{
  --ui:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --paper:#f1efe9;--card:#fff;--ink:#233038;--ink2:#3a4a54;--muted:#6a7a84;--faint:#9fb0b8;
  --line:#e7e2d9;--line2:#eef1f4;--teal:#17a2b8;--teal-ink:#0f7d8f;--teal-wash:#e8f6f8;
  --green:#568E62;--green-ink:#39684a;--green-wash:#eef4ef;--blue:#3E9EB3;--blue-ink:#2f7d90;--blue-wash:#e9f4f6;
  --plum:#AC659D;--plum-ink:#7c4470;--plum-wash:#f6eff4;--gold:#D9B93B;--gold-ink:#8a7415;--gold-wash:#fbf6e4;
  --coral:#C96A44;--coral-ink:#9a4a2b;--coral-wash:#f9ede7;--slate:#5b7a99;--indigo:#5E6FB2;--jade:#3E9E86;--rose:#C67BA0;--violet:#7C5192;--slate-ink:#3f5a75;--slate-wash:#eef2f6;
  --rolec:#17a2b8;--shadow:0 1px 2px rgba(60,50,35,.04),0 12px 30px -18px rgba(60,50,35,.18);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:var(--ui);background:var(--paper);color:var(--ink);letter-spacing:-.01em}
button,input,select,textarea{font:inherit}button{cursor:pointer}

/* shared header chrome */
.topbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brandplate{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--acc,var(--teal));box-shadow:0 8px 18px -9px var(--acc,var(--teal))}.brandplate svg{width:18px;height:18px}
.dept{font-size:14px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:var(--teal-ink);white-space:nowrap}
.hdivider{width:1px;height:26px;background:var(--line)}
.apptitle{font-weight:850;font-size:16px}
.backlink{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;text-decoration:none}
.backlink:hover{border-color:var(--teal);color:var(--teal-ink)}

.wrap{padding:16px 22px 30px;max-width:1560px;margin:0 auto}
.viewhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}.viewhead h2{font-size:26px;margin:0 0 3px;font-weight:850;letter-spacing:-.02em}.viewhead p{font-size:15px;color:var(--muted);margin:0}.viewhead .push{margin-left:auto;display:flex;gap:7px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:800}.btn:hover{border-color:var(--teal);color:var(--teal-ink)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:0 1px 2px rgba(60,50,35,.035),0 8px 22px -20px rgba(60,50,35,.18)}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ph h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.055em;font-weight:900}.ph .push{margin-left:auto}
.plate{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--acc,var(--teal));box-shadow:0 8px 18px -9px var(--acc,var(--teal));flex:none}.plate svg{width:16px;height:16px}
.minor{font-size:13px;background:var(--paper);color:var(--muted);border-radius:99px;padding:3px 7px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.caption{font-size:12.5px;color:var(--muted);margin-top:4px}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{padding:11px 13px;border-bottom:1px solid var(--line2);text-align:left;font-size:15.5px}th{background:#fbfcfc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}
.status{display:inline-flex;border-radius:99px;padding:3px 7px;font-size:12.5px;font-weight:900}.good{background:var(--green-wash);color:var(--green-ink)}.warn{background:var(--gold-wash);color:var(--gold-ink)}.bad{background:#fff1ee;color:#a34a3f}.info{background:var(--blue-wash);color:var(--blue-ink)}
.switch{position:relative;display:inline-block;width:34px;height:19px}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:99px;background:#d8dde0}.slider:before{content:'';position:absolute;width:13px;height:13px;border-radius:50%;left:3px;top:3px;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}.switch input:checked + .slider{background:var(--teal)}.switch input:checked + .slider:before{transform:translateX(15px)}
.drawer{position:fixed;top:0;right:-410px;width:390px;max-width:94vw;height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-18px 0 45px -25px rgba(0,0,0,.3);z-index:80;transition:.22s;padding:17px;overflow:auto}.drawer.open{right:0}.drawer h3{margin:0 0 3px;font-size:19.5px}.drawer p{margin:0 0 12px;color:var(--muted);font-size:12.5px}.close{position:absolute;right:10px;top:10px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(14px);opacity:0;background:var(--ink);color:#fff;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:800;transition:.18s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lst-empty{color:var(--muted);font-size:13.5px;padding:14px 4px;text-align:center}td.lst-empty{padding:18px 4px}

/* ===== LEDGERS ===== */
.ledbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.ledbar label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ledbar select{font:inherit;font-size:14px;font-weight:700;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.ledyear{font-weight:800;color:var(--muted);font-size:14px;margin-left:8px}
.ledchips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:960px){.ledchips{grid-template-columns:repeat(2,1fr)}}
.ledchip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 13px;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:11px;background:#fff;cursor:pointer;transition:.15s;text-align:left}
.ledchip:hover{box-shadow:0 8px 18px -14px rgba(0,0,0,.4)}
.ledchip.on{border-color:var(--acc);box-shadow:0 10px 20px -12px var(--acc)}
.ledchip-t{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ledchip-b{font-size:17px;font-weight:800;color:var(--ink)}
.ledmonths{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ledmo{font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer}
.ledmo:hover{border-color:var(--blue)}.ledmo.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ledacct .ph h3{color:var(--blue-ink)}
.ledbal{font-size:16px;font-weight:800;color:var(--blue-ink)}
.ledtable th.num,.ledtable td.num{text-align:right;white-space:nowrap}
.ledtable td.dep{color:var(--green-ink);font-weight:700}
.ledtable td.deb{color:var(--coral-ink);font-weight:700}
.ledtable td.bal{font-weight:800}
.ledtable tr.fwd td{color:var(--muted);font-style:italic;background:#fbfcfd}
.ledtable th.vfy,.ledtable td.vfy{text-align:center;width:70px}
.vbtn{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:#fff;display:inline-grid;place-items:center;cursor:pointer;color:#fff}

.ledempty{color:var(--muted);text-align:center;padding:14px 0}

.ledcfg-note{font-size:10.5px;color:var(--muted);margin-top:9px;line-height:1.4}

.delno{background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;margin-left:4px}

/* ===== INDIVIDUALS ===== */
.zonehead th{background:#fff;border-bottom:0;padding:10px 13px 5px;font-size:13.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}

.ledrep-sign{margin-top:26px;font-size:11px}
@media print{

<script>
hydrateIcons();
function toastMsg(s){var t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1600);}

/* ============================================================
   DATA ADAPTER — single object, every read/write stubbed.
   CONFIG.useSupabase toggles mock (localStorage) vs live.
   Real Supabase queries are commented alongside each stub.
   ============================================================ */
const CONFIG={useSupabase:false};
let sb=null;
try{ if(CONFIG.useSupabase && window.supabase && window.HASC_CONFIG){ sb=window.__hascClient||window.supabase.createClient(window.HASC_CONFIG.SUPABASE_URL,window.HASC_CONFIG.SUPABASE_ANON_KEY); window.__hascClient=sb; } }catch(e){}

const IKEY='hascos.individuals.v1';   // shared dev-mock key (Individuals app writes the same)
const LKEY='hascos.ledgers.v1';
const CFGKEY='hascos.homeaccts.v1';
const BANKKEY='hascos.bankname.v1';
const LOGKEY='hascos.ledgerlog.v1';

const API={
  async loadResidents(){
    if(CONFIG.useSupabase && sb){
      // const {data}=await sb.from('individuals').select('id,name,home_name'); return (data||[]).map(r=>({id:r.id,name:r.name,home:r.home_name}));
    }
    try{return JSON.parse(localStorage.getItem(IKEY)||'[]');}catch(e){return [];}
  },
  loadLedgers(){
    if(CONFIG.useSupabase && sb){ /* hydrate from sb.from('ledger_entries')… (wire later) */ }
    try{return JSON.parse(localStorage.getItem(LKEY)||'{}');}catch(e){return {};}
  },
  saveLedgers(db){
    if(CONFIG.useSupabase && sb){ /* upsert changed rows into sb.from('ledger_entries') */ }
    try{localStorage.setItem(LKEY,JSON.stringify(db));}catch(e){}
  },
  loadHomeCfg(){try{return JSON.parse(localStorage.getItem(CFGKEY)||'{}');}catch(e){return {};}},
  saveHomeCfg(v){try{localStorage.setItem(CFGKEY,JSON.stringify(v));}catch(e){}},
  loadBank(){try{var v=localStorage.getItem(BANKKEY);return (v===null||v===undefined)?'TD Bank':v;}catch(e){return 'TD Bank';}},
  saveBank(v){try{localStorage.setItem(BANKKEY,v);}catch(e){}},
  loadLog(){try{return JSON.parse(localStorage.getItem(LOGKEY)||'{}');}catch(e){return {};}},
  saveLog(v){try{localStorage.setItem(LOGKEY,JSON.stringify(v));}catch(e){}}
};

/* ============================================================
   LEDGER ENGINE  (Mark 4 — verify col, bank cfg, per-home
   accounts, change log, printable reports)
   ============================================================ */
const LED_ACCTS=[
 {key:'inhouse',label:'In-House Account',bank:false,color:'blue'},
 {key:'savings',label:'Savings',bank:true,color:'green'},
 {key:'checking',label:'Checking',bank:true,color:'teal'},
 {key:'clothing',label:'Client Clothing',bank:false,color:'plum'}
];
const LED_ACCT_KEYS=['inhouse','savings','checking','clothing'];
const LED_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LED_MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const LED_YEAR=2026;

let RESIDENTS=[];
let LEDGERS=API.loadLedgers();
let LEDGER_LOG=API.loadLog();
let HOME_ACCT_CFG=API.loadHomeCfg();
let BANK_NAME=API.loadBank();

let ledHome=null, ledgerSel=null, ledAcct='inhouse';
let ledMonth=(new Date().getFullYear()===LED_YEAR?(new Date().getMonth()+1):1);
let ledCfgOpen=false, ledLogOpen=false, ledDelArm=null;

function bankSave(){BANK_NAME=BANK_NAME;API.saveBank(BANK_NAME);}
function ledAcctName(key){var a=LED_ACCTS.find(function(x){return x.key===key;});if(!a)return key;return a.bank?((BANK_NAME?BANK_NAME+' ':'')+a.label):a.label;}
function hacSave(){API.saveHomeCfg(HOME_ACCT_CFG);}
function enabledAcctsFor(home){var v=HOME_ACCT_CFG[home];return (v===undefined)?LED_ACCT_KEYS.slice():v;}
function currentUser(){return 'Michael Shilcrat';}
function ledLog(resId,action,detail){if(!LEDGER_LOG[resId])LEDGER_LOG[resId]=[];LEDGER_LOG[resId].push({ts:new Date().toISOString(),user:currentUser(),action:action,detail:detail});API.saveLog(LEDGER_LOG);}
function ledPad(n){return (n<10?'0':'')+n;}
function ledFmt(n){return '$'+(Math.round((+n||0)*100)/100).toFixed(2);}
function ensureLedger(id){
  if(LEDGERS[id])return LEDGERS[id];
  function A(name){return {name:name,opening:0,months:{}};}
  var L={inhouse:A('In-House Account'),savings:A('Savings'),checking:A('Checking'),clothing:A('Client Clothing')};
  LEDGERS[id]=L;return L;
}
function ledForward(acct,month){var b=+acct.opening||0;for(var m=1;m<month;m++){(acct.months[m]||[]).forEach(function(t){b+=(+t.deposit||0)-(+t.debit||0);});}return b;}
function ledClosing(acct,month){var b=ledForward(acct,month);(acct.months[month]||[]).forEach(function(t){b+=(+t.deposit||0)-(+t.debit||0);});return b;}
function saveLedgers(){API.saveLedgers(LEDGERS);}

function renderLedgers(){
  var host=document.getElementById('ledgerRoot');if(!host)return;
  if(typeof HOMES==='undefined'){host.innerHTML='<div class="panel"><p style="color:var(--muted)">Roster not loaded.</p></div>';return;}
  if(!RESIDENTS.length){
    host.innerHTML='<div class="ledbar"><label>Home</label><select id="ledHomePick">'+HOMES.map(function(h){return '<option'+(h.name===ledHome?' selected':'')+'>'+h.name+'</option>';}).join('')+'</select></div>'+
      '<div class="panel"><p style="color:var(--muted);padding:8px 2px">No residents recorded yet. Add them in the Individuals app — ledgers attach to each resident automatically.</p></div>';
    var hp0=document.getElementById('ledHomePick');if(hp0)hp0.onchange=function(){ledHome=hp0.value;renderLedgers();};
    return;
  }
  if(!ledHome||!HOMES.find(function(h){return h.name===ledHome;}))ledHome=(RESIDENTS[0]&&RESIDENTS[0].home)||(HOMES[0]&&HOMES[0].name);
  var homeOpts=HOMES.map(function(h){return '<option'+(h.name===ledHome?' selected':'')+'>'+h.name+'</option>';}).join('');
  var people=RESIDENTS.filter(function(p){return p.home===ledHome;});
  var enabled=enabledAcctsFor(ledHome);
  var acctBtns='<button class="btn ledlogbtn" style="margin-left:auto">Log book</button><button class="btn ledacctcfg" style="margin-left:8px">Accounts</button><button class="btn ledprintall" style="margin-left:8px">Print all accounts</button>';
  var cfgPanel='<div class="ledcfg'+(ledCfgOpen?' open':'')+'"><div class="ledcfg-h">Accounts used by '+ledHome+'</div>'+
    '<div class="ledcfg-bank"><label>Bank</label><input id="bankName" value="'+BANK_NAME+'"></div>'+
    LED_ACCTS.map(function(a){return '<label class="ledcfg-row"><span>'+ledAcctName(a.key)+'</span><input type="checkbox" data-acfg="'+a.key+'"'+(enabled.indexOf(a.key)>=0?' checked':'')+'></label>';}).join('')+
    '<div class="ledcfg-note">Set per home. Wire-ready to Supabase so this follows the home, not the browser.</div></div>';
  function wireCommon(){
    var hp=document.getElementById('ledHomePick');if(hp)hp.onchange=function(){ledHome=hp.value;ledgerSel=null;ledCfgOpen=false;renderLedgers();};
    var cfgb=host.querySelector('.ledacctcfg');if(cfgb)cfgb.onclick=function(){if(HOME_ACCT_CFG[ledHome]===undefined)HOME_ACCT_CFG[ledHome]=enabledAcctsFor(ledHome).slice();ledCfgOpen=!ledCfgOpen;renderLedgers();};
    host.querySelectorAll('[data-acfg]').forEach(function(cb){cb.onchange=function(){var k=cb.dataset.acfg;if(HOME_ACCT_CFG[ledHome]===undefined)HOME_ACCT_CFG[ledHome]=enabledAcctsFor(ledHome).slice();var arr=HOME_ACCT_CFG[ledHome];if(cb.checked){if(arr.indexOf(k)<0)arr.push(k);}else{HOME_ACCT_CFG[ledHome]=arr.filter(function(x){return x!==k;});}hacSave();ledCfgOpen=true;renderLedgers();};});
    var pAll=host.querySelector('.ledprintall');if(pAll)pAll.onclick=function(){doLedPrint('all');};
    var lb=host.querySelector('.ledlogbtn');if(lb)lb.onclick=function(){ledLogOpen=!ledLogOpen;renderLedgers();};
    var bn=document.getElementById('bankName');if(bn){bn.oninput=function(){BANK_NAME=bn.value;bankSave();};bn.onchange=function(){renderLedgers();};}
  }
  if(!people.length){
    host.innerHTML='<div class="ledbar"><label>Home</label><select id="ledHomePick">'+homeOpts+'</select>'+acctBtns+'</div>'+cfgPanel+'<p style="color:var(--muted);padding:8px 2px">No residents recorded for this home yet.</p>';
    wireCommon();return;
  }
  if(!ledgerSel||!people.find(function(p){return p.id===ledgerSel;}))ledgerSel=people[0].id;
  var cur=people.find(function(p){return p.id===ledgerSel;});
  var led=ensureLedger(cur.id);
  if(enabled.indexOf(ledAcct)<0)ledAcct=enabled[0]||null;
  var chips=LED_ACCTS.filter(function(a){return enabled.indexOf(a.key)>=0;}).map(function(a){var bal=ledClosing(led[a.key],ledMonth);return '<button class="ledchip'+(a.key===ledAcct?' on':'')+'" data-acct="'+a.key+'" style="--acc:var(--'+a.color+')"><span class="ledchip-t">'+ledAcctName(a.key)+'</span><span class="ledchip-b">'+ledFmt(bal)+'</span></button>';}).join('');
  var months=LED_MONTHS.map(function(mn,i){return '<button class="ledmo'+((i+1)===ledMonth?' on':'')+'" data-mo="'+(i+1)+'">'+mn+'</button>';}).join('');
  var bar='<div class="ledbar"><label>Home</label><select id="ledHomePick">'+homeOpts+'</select><label>Resident</label><select id="ledPick">'+people.map(function(p){return '<option value="'+p.id+'"'+(p.id===ledgerSel?' selected':'')+'>'+p.name+'</option>';}).join('')+'</select><span class="ledyear">'+LED_YEAR+'</span>'+acctBtns+'</div>';
  var reg;
  if(ledAcct){
    var acct=led[ledAcct];var fwd=ledForward(acct,ledMonth);var b=fwd;
    var trs=(acct.months[ledMonth]||[]).map(function(t,idx){b+=(+t.deposit||0)-(+t.debit||0);return '<tr><td>'+t.date+'</td><td>'+(t.rec||'')+'</td><td>'+t.desc+'</td><td class="num dep">'+(t.deposit?ledFmt(t.deposit):'')+'</td><td class="num deb">'+(t.debit?ledFmt(t.debit):'')+'</td><td class="num bal">'+ledFmt(b)+'</td><td class="vfy"><button class="vbtn'+(t.verified?' ok':'')+'" data-vidx="'+idx+'" title="Verify">'+(t.verified?INDEX_ICONS.check:'')+'</button></td><td class="lact">'+(ledDelArm===(ledAcct+':'+ledMonth+':'+idx)?'<button class="delok" data-didx="'+idx+'">Delete</button><button class="delno">Cancel</button>':'<button class="delbtn" data-didx="'+idx+'" title="Delete line">\u2715</button>')+'</td></tr>';}).join('');
    reg='<div class="ledchips">'+chips+'</div><div class="ledmonths">'+months+'</div>'+
      '<section class="panel ledacct"><div class="ph"><span class="plate" style="--acc:var(--blue)">'+INDEX_ICONS.ledger+'</span><h3>'+ledAcctName(ledAcct)+' \u00b7 '+LED_MONTHS[ledMonth-1]+' '+LED_YEAR+'</h3><div class="push"><button class="btn ledprint" style="margin-right:8px">Print</button><span class="ledbal">'+ledFmt(ledClosing(acct,ledMonth))+'</span></div></div>'+
      '<div class="tablewrap"><table class="ledtable"><thead><tr><th>Date</th><th>Rec#</th><th>Description</th><th class="num">Deposit</th><th class="num">Debit</th><th class="num">Balance</th><th class="vfy">Verified</th><th class="lact"></th></tr></thead><tbody>'+
      '<tr class="fwd"><td>'+LED_YEAR+'-'+ledPad(ledMonth)+'-01</td><td></td><td>Balance Forward</td><td class="num"></td><td class="num"></td><td class="num bal">'+ledFmt(fwd)+'</td><td class="vfy"></td><td class="lact"></td></tr>'+trs+
      '</tbody></table></div>'+
      '<div class="ledadd"><input type="date" data-f="date" value="'+LED_YEAR+'-'+ledPad(ledMonth)+'-01"><input placeholder="Rec#" data-f="rec" class="recin"><input placeholder="Description" data-f="desc" class="descin"><input placeholder="Deposit" data-f="deposit" inputmode="decimal" class="amtin"><input placeholder="Debit" data-f="debit" inputmode="decimal" class="amtin"><label class="vchk"><input type="checkbox" data-f="verified"> Verified</label><button class="btn primary ledaddbtn">Add</button></div></section>';
  } else {
    reg='<div class="ledchips">'+chips+'</div><div class="panel"><p style="color:var(--muted);padding:10px 2px">No accounts enabled for this home. Click <b>Accounts</b> above to turn one on.</p></div>';
  }
  var logPanel='';if(ledLogOpen){var _L=(LEDGER_LOG[cur.id]||[]).slice().reverse();var _rows=_L.length?_L.map(function(e){var d=new Date(e.ts);return '<tr><td>'+d.toLocaleDateString()+'</td><td>'+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</td><td>'+e.user+'</td><td>'+e.action+'</td><td>'+e.detail+'</td></tr>';}).join(''):'<tr><td colspan="5" class="ledempty">No changes recorded yet.</td></tr>';logPanel='<section class="panel ledlog"><div class="ph"><h3>Change Log \u2014 '+cur.name+'</h3><div class="push"><span class="status good">'+_L.length+' entries</span></div></div><div class="tablewrap"><table class="ledtable"><thead><tr><th>Date</th><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>'+_rows+'</tbody></table></div></section>';}
  host.innerHTML=bar+cfgPanel+reg+logPanel;
  wireCommon();
  var pick=document.getElementById('ledPick');if(pick)pick.onchange=function(){ledgerSel=pick.value;renderLedgers();};
  host.querySelectorAll('.ledchip').forEach(function(c){c.onclick=function(){ledAcct=c.dataset.acct;renderLedgers();};});
  host.querySelectorAll('.ledmo').forEach(function(c){c.onclick=function(){ledMonth=+c.dataset.mo;renderLedgers();};});
  host.querySelectorAll('.vbtn').forEach(function(v){v.onclick=function(){var i=+v.dataset.vidx;var arr=ensureLedger(cur.id)[ledAcct].months[ledMonth];if(arr&&arr[i]){arr[i].verified=!arr[i].verified;saveLedgers();ledLog(cur.id,arr[i].verified?'Marked verified':'Unmarked verified',ledAcctName(ledAcct)+' \u00b7 '+LED_MONTHS[ledMonth-1]+' \u00b7 '+arr[i].desc);renderLedgers();}};});
  var pOne=host.querySelector('.ledprint');if(pOne)pOne.onclick=function(){doLedPrint('one');};
  var addb=host.querySelector('.ledaddbtn');if(addb)addb.onclick=function(){
    var panel=addb.closest('.ledacct');var g=function(f){return panel.querySelector('[data-f="'+f+'"]');};
    var desc=g('desc').value.trim();if(!desc){toastMsg('Add a description');return;}
    var dep=parseFloat(g('deposit').value)||0,deb=parseFloat(g('debit').value)||0;
    if(!dep&&!deb){toastMsg('Enter a deposit or debit');return;}
    var a=ensureLedger(cur.id)[ledAcct];if(!a.months[ledMonth])a.months[ledMonth]=[];
    a.months[ledMonth].push({date:g('date').value||LED_YEAR+'-'+ledPad(ledMonth)+'-01',rec:g('rec').value.trim(),desc:desc,deposit:dep,debit:deb,verified:g('verified').checked});
    saveLedgers();ledLog(cur.id,'Added transaction',ledAcctName(ledAcct)+' \u00b7 '+LED_MONTHS[ledMonth-1]+' \u00b7 '+desc+' '+(dep?('+'+ledFmt(dep)):('-'+ledFmt(deb))));
    renderLedgers();toastMsg('Transaction added');
  };
  host.querySelectorAll('.delbtn').forEach(function(bn){bn.onclick=function(){ledDelArm=ledAcct+':'+ledMonth+':'+bn.dataset.didx;renderLedgers();};});
  host.querySelectorAll('.delno').forEach(function(bn){bn.onclick=function(){ledDelArm=null;renderLedgers();};});
  host.querySelectorAll('.delok').forEach(function(bn){bn.onclick=function(){var i=+bn.dataset.didx;var arr=ensureLedger(cur.id)[ledAcct].months[ledMonth];if(arr&&arr[i]){var t=arr[i];ledLog(cur.id,'Deleted transaction',ledAcctName(ledAcct)+' \u00b7 '+LED_MONTHS[ledMonth-1]+' \u00b7 '+t.desc+' '+((+t.deposit)?('+'+ledFmt(t.deposit)):('-'+ledFmt(t.debit))));arr.splice(i,1);saveLedgers();}ledDelArm=null;renderLedgers();toastMsg('Line deleted');};});
}

/* ---- printable reports (mirrors Mark 4) ---- */
function ledShortDate(d){var p=(''+d).split('-');if(p.length!==3)return d||'';return (+p[1])+'/'+(+p[2])+'/'+p[0].slice(2);}
function ledReportRows(acct,month){
  var fwd=ledForward(acct,month);var b=fwd;
  var out=[{date:LED_YEAR+'-'+ledPad(month)+'-01',desc:'Balance Forward',dep:'',deb:'',bal:b,fwd:true,rec:''}];
  (acct.months[month]||[]).forEach(function(t){b+=(+t.deposit||0)-(+t.debit||0);out.push({date:t.date,rec:t.rec||'',desc:t.desc,dep:t.deposit?ledFmt(t.deposit):'',deb:t.debit?ledFmt(t.debit):'',bal:b});});
  while(out.length<25)out.push({date:'',rec:'',desc:'',dep:'',deb:'',bal:b});
  return out;
}
function ledReportPage(logo,resName,key,acct,month){
  var rows=ledReportRows(acct,month);
  var body=rows.map(function(r){return '<tr><td>'+(r.date?ledShortDate(r.date):'')+'</td><td>'+(r.rec||'')+'</td><td class="desc">'+(r.fwd?'<b>Balance Forward</b>':(r.desc||''))+'</td><td class="num">'+(r.dep||'')+'</td><td class="num">'+(r.deb||'')+'</td><td class="bal">'+ledFmt(r.bal)+'</td></tr>';}).join('');
  return '<div class="ledrep-page">'+(logo?'<img class="ledrep-logo" src="'+logo+'">':'')+'<h1 class="ledrep-name">'+resName+'</h1>'+
    '<table class="ledrep-table"><thead>'+
    '<tr class="ledrep-band"><th colspan="2"><u>'+LED_MONTHS_FULL[month-1]+' '+LED_YEAR+'</u></th><th class="acctband">'+ledAcctName(key)+'</th><th colspan="3">Name: '+resName+'</th></tr>'+
    '<tr class="ledrep-cols"><th>Date</th><th>Rec#</th><th>Description</th><th class="num">Deposit</th><th class="num">Debit</th><th class="num">Balance</th></tr>'+
    '</thead><tbody>'+body+'</tbody></table>'+
    '<div class="ledrep-sign"><div>Manager Signature__________________________&nbsp;&nbsp;&nbsp;&nbsp;Date__________________</div><div style="margin-top:26px">Individual Signature__________________________</div></div></div>';
}
function doLedPrint(scope){
  var cur=RESIDENTS.find(function(p){return p.id===ledgerSel;});if(!cur)return;
  var led=ensureLedger(cur.id);
  var keys=scope==='all'?enabledAcctsFor(cur.home):[ledAcct];
  var host=document.getElementById('ledReport');if(!host)return;
  var logo='/hasc-logo.png';
  host.innerHTML=keys.map(function(k){return ledReportPage(logo,cur.name,k,led[k],ledMonth);}).join('');
  window.print();
}

/* ---- boot ---- */
(async function(){
  RESIDENTS=await API.loadResidents();
  var dm=document.getElementById('dataMode');
  if(dm)dm.textContent=CONFIG.useSupabase?'Supabase connected':'Wire-ready · mock data';
  renderLedgers();
})();
</script>
