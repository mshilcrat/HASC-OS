<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HASC OS — Staff</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/wb-config.js"></script>
<script src="/wb-guard.js"></script>
<style>
:root{--ink:#24313a;--muted:#75828b;--line:#e2e5e2;--paper:#f3f0e9;--white:#fff;--teal:#159aaa;--teal2:#0d7d8c;--done:#178a6d;--warn:#985021;--soft:#ffead7;--blue:#4E86C9;--jade:#568E62;--gold:#D6A21F}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);font-size:14px;overflow:hidden}button,input,select{font:inherit}.main{height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}.rail{background:#fff;border-right:1px solid #e7e2d9;padding:14px 12px;overflow:auto}.rail-label{font-size:11px;color:#8fa0a8;letter-spacing:.12em;font-weight:800;text-transform:uppercase;padding:13px 10px 7px}.nav{display:grid;gap:4px}.navbtn{width:100%;min-height:44px;border:0;background:transparent;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:11px;text-align:left;color:#3a4a54;font-size:14px;font-weight:700;cursor:pointer}.navbtn:hover{background:#f1efe9}.navbtn.active{background:#eaf5f6;color:#176f7b}.nav-ic{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--tile);color:#fff}.nav-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}.wrap{min-width:0;min-height:0;overflow:auto;padding:24px 30px 40px}.crumb{font-size:11.5px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}.head h1{font-size:28px;letter-spacing:-.04em;margin:0}.head p{font-size:14px;line-height:1.55;color:var(--muted);margin:5px 0 0;max-width:760px}.head .right{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid #cbd7e2;background:#fff;color:#26343d;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer}.btn:hover{background:#f7fafb}.btn.primary{background:#edf6f7;color:#326f78;border-color:#c7dde1}.controls{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.controls input,.controls select{height:42px;border:1px solid #d2dce3;border-radius:11px;padding:0 12px;font-size:14px;color:#40515e;background:#fff}.controls input{flex:1;max-width:460px}.acc{background:#fff;border:1px solid #e1e6e8;border-radius:14px;box-shadow:0 5px 16px rgba(37,58,73,.04);margin-bottom:10px;overflow:hidden}.acc-h{display:flex;align-items:center;gap:13px;width:100%;border:0;background:#fff;padding:15px 18px;cursor:pointer;text-align:left}.acc-h:hover{background:#fbfdfd}.chev{color:#8da1b2;font-weight:900;font-size:12px;transition:.18s}.acc.open .chev{transform:rotate(90deg)}.acc-h h3{margin:0;font-size:15px}.acc-h .ah{flex:1}.meta{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px}.acc-b{display:none;padding:8px 12px 14px;border-top:1px solid #eef0f2;background:#fbfdfd}.acc.open .acc-b{display:block}.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:3px}.staffrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}.staffrow:hover{background:#f1f6f7}.ini{width:32px;height:32px;border-radius:8px;background:#edf6f7;color:#377984;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}.nm{font-size:14px;font-weight:700;flex:1}.sub{font-size:12.5px;color:var(--muted)}.pill{font-size:11px;font-weight:700;border-radius:999px;padding:4px 8px;background:#f1f3f4;color:#62717a}.pill.done{background:#e4f7ed;color:var(--done)}.pill.warn{background:var(--soft);color:var(--warn)}.tbl{background:#fff;border:1px solid #dfe6e8;border-radius:14px;overflow:hidden;box-shadow:0 5px 16px rgba(37,58,73,.04)}.tr{display:grid;gap:12px;align-items:center;padding:12px 16px}.tr.h{background:#f7f9fb;color:#7d8fa5;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.tr.r{border-top:1px solid #eef0f2;font-size:14px}.tr.r strong{font-size:15px}.empty{padding:26px;text-align:center;color:#85929a;font-size:14px;background:#fff;border:1px dashed #d9e2e6;border-radius:12px}.reviewcard{background:#fff;border:1px solid #e7ded2;border-radius:14px;box-shadow:0 5px 16px rgba(37,58,73,.04);margin-bottom:10px;padding:15px 17px}.reviewtop{display:flex;align-items:center;gap:12px}.reviewtop .who{flex:1}.reviewtop .who b{display:block;font-size:15px}.reviewtop .who span{font-size:13px;color:var(--muted)}.candidates{margin-top:12px;border-top:1px solid #eef0f2;padding-top:10px;display:grid;gap:7px}.candidate{display:flex;align-items:center;gap:10px;background:#fbfdfd;border:1px solid #eef0f2;border-radius:9px;padding:10px}.candidate .grow{flex:1}.candidate b{font-size:14px}.candidate span{display:block;font-size:13px;color:var(--muted);margin-top:2px}.matchbtn{border:1px solid #b9dfe4;background:#e8f6f8;color:#0d7482;border-radius:9px;font-size:13px;font-weight:700;padding:9px 14px;cursor:pointer}.coverage-home{background:#fff;border:1px solid #e2e7e9;border-radius:14px;box-shadow:0 5px 16px rgba(37,58,73,.035);margin-bottom:12px;overflow:hidden}.coverage-home-h{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid #eef0f2;background:#fbfcfc}.coverage-home-h h3{margin:0;font-size:16px}.shiftgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}.shiftcard{background:#fbfcfc;border:1px solid #e4e9eb;border-radius:11px;padding:12px}.shiftcard h4{font-size:14px;margin:0 0 4px}.when{font-size:12.5px;color:var(--muted);margin-bottom:9px}.assignment{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e7ecee;border-radius:9px;padding:9px}.assignment .grow{flex:1}.assignment b{display:block;font-size:14px}.assignment span{font-size:12.5px;color:var(--muted)}.softaction{margin-top:8px;background:#fff;color:#53626a;border:1px solid #cfd9dd;border-radius:9px;font-size:13px;font-weight:650;padding:8px 11px;cursor:pointer}.emptyshift+.softaction{background:#eaf6f7;color:#246f79;border-color:#bfdde1}.emptyshift{background:#fff;border:1px dashed #dce4e7;border-radius:9px;padding:14px 9px;text-align:center;font-size:13px;color:#7a8890}.pool{background:#fff;border:1px solid #e2e7e9;border-radius:14px;overflow:hidden;margin-top:14px}.pool-h{padding:13px 15px;border-bottom:1px solid #eef0f2}.pool-h h3{margin:0;font-size:15px}.pool-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}.poolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px}.poolrow{display:flex;align-items:center;gap:9px;border:1px solid #e7ecee;border-radius:9px;padding:9px 10px}.poolrow .grow{flex:1}.poolrow b{display:block;font-size:14px}.poolrow span{font-size:12.5px;color:var(--muted)}.form{background:#fff;border:1px solid #e1e6e8;border-radius:15px;padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:10px;align-items:end}.fld{display:flex;flex-direction:column;gap:5px}.fld label{font-size:11px;font-weight:800;color:#8a97a0;text-transform:uppercase}.fld input,.fld select{height:42px;border:1px solid #d2dce3;border-radius:10px;padding:0 11px;font-size:14px;background:#fff}.addbtn{height:42px;border-radius:10px;background:#edf6f7;color:#326f78;border:1px solid #c7dde1;font-weight:700;font-size:13px;padding:0 18px;cursor:pointer}.rmv{border:1px solid #dfd3c8;background:#fff;color:#8f5636;border-radius:8px;font-size:12px;font-weight:700;padding:7px 10px;cursor:pointer}.scrim{position:fixed;inset:0;background:rgba(28,40,48,.3);opacity:0;pointer-events:none;transition:.2s;z-index:40}.scrim.on{opacity:1;pointer-events:auto}.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:94vw;background:#fff;box-shadow:-14px 0 40px rgba(28,40,48,.14);transform:translateX(100%);transition:.24s;z-index:41;display:flex;flex-direction:column}.drawer.on{transform:none}.dh{padding:22px;border-bottom:1px solid #eef0f2}.dh .who{display:flex;align-items:center;gap:12px}.dh h2{margin:0;font-size:21px}.dh .x{margin-left:auto;border:0;background:#f1efe9;width:34px;height:34px;border-radius:9px;cursor:pointer}.dbody{padding:18px 22px 28px;overflow:auto}.sectionlab{font-size:13px;color:#65757f;font-weight:700;letter-spacing:.045em;text-transform:uppercase;margin:0 0 10px}.hist{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 0;border-top:1px solid #f0f2f3}.hist:first-of-type{border-top:0}.dot{width:9px;height:9px;border-radius:50%;background:#4fa07a}.hist b{font-size:14px}.date{font-size:14px;font-weight:800;color:#52636d;background:#f1f4f5;border-radius:8px;padding:5px 8px;white-space:nowrap}.shabbox{margin-top:18px;padding-top:15px;border-top:1px solid #eef0f2}.toast{position:fixed;right:22px;bottom:22px;background:#263841;color:#fff;border-radius:9px;padding:11px 15px;font-size:13px;font-weight:700;z-index:60}
@media(max-width:900px){.main{grid-template-columns:68px 1fr}.rail-label,.navbtn span.label{display:none}.navbtn{justify-content:center}.shiftgrid{grid-template-columns:1fr 1fr}.poolgrid{grid-template-columns:1fr}.form{grid-template-columns:1fr}}@media(max-width:650px){.shiftgrid{grid-template-columns:1fr}.wrap{padding:18px 14px}}
</style></head><body>
<div class="main"><aside class="rail" id="rail"></aside><main class="wrap"><div id="view"></div></main></div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div><aside class="drawer" id="drawer"></aside>
<svg width="0" height="0"><defs><symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6L21 9.3l-4.5 4.3 1.1 6.1L12 17l-5.6 2.7 1.1-6.1L3 9.3l6.4-.7z"/></symbol><symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5.8"/><path d="M17 14a6 6 0 0 1 4 6"/></symbol></defs></svg>
<script>
let SB=null,STAFF=[],RES=[],CERTS=[],SIGNS=[],SHIFTS=[],CURRENT='homes';
const SHIFTTYPES=['Morning','Evening','Night','Overnight Awake','Overnight Asleep','Shabbos'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const ini=n=>String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const norm=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const fmt=d=>d?new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';
function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function closeDrawer(){scrim.classList.remove('on');drawer.classList.remove('on')}
function staffById(id){return STAFF.find(s=>s.id===id)}
function staffForRes(res){return RES.filter(r=>r.residence===res).map(r=>({r,s:staffById(r.staff_id)})).filter(x=>x.s).sort((a,b)=>a.s.name.localeCompare(b.s.name))}
function certsFor(s,res){return CERTS.filter(c=>!c.is_archived&&c.residence===res&&norm(c.dsp_name)===norm(s.name)).sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at))}
function signsFor(s,res){return SIGNS.filter(x=>x.home===res&&x.matched_staff_id===s.id).sort((a,b)=>new Date(b.signed_at)-new Date(a.signed_at))}
function assignmentFor(res,type){return SHIFTS.find(x=>x.residence===res&&x.shift_type===type)}
function residenceNames(){return [...new Set(RES.map(r=>r.residence))].sort()}
function nav(){rail.innerHTML=`<div class="rail-label">Staff</div><div class="nav"><button class="navbtn" data-v="homes"><span class="nav-ic" style="--tile:var(--blue)"><svg><use href="#i-grid"/></svg></span><span class="label">By Residence</span></button><button class="navbtn" data-v="review"><span class="nav-ic" style="--tile:var(--gold)"><svg><use href="#i-star"/></svg></span><span class="label">Needs Review (${SIGNS.filter(s=>s.match_status==='needs_review').length})</span></button><button class="navbtn" data-v="coverage"><span class="nav-ic" style="--tile:var(--jade)"><svg><use href="#i-people"/></svg></span><span class="label">Staffing & Coverage</span></button></div><div class="rail-label">Admin</div><div class="nav"><button class="navbtn" data-v="manage"><span class="nav-ic" style="--tile:#C96A44"><svg><use href="#i-people"/></svg></span><span class="label">Manage Staff</span></button></div>`;rail.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.v));}
function go(v){CURRENT=v;rail.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));({homes:renderHomes,review:renderReview,coverage:renderCoverage,manage:renderManage}[v]||renderHomes)()}
function renderHomes(){const hs=residenceNames();view.innerHTML=`<div class="crumb">Staff / By Residence</div><div class="head"><div><h1>Staff by Residence</h1><p>Live staff profiles by residence. Training and Shabbos history are pulled from Supabase.</p></div><div class="right"><button class="btn" onclick="document.querySelectorAll('.acc').forEach(x=>x.classList.add('open'))">Expand all</button><button class="btn" onclick="document.querySelectorAll('.acc').forEach(x=>x.classList.remove('open'))">Collapse all</button></div></div><div class="controls"><input id="filter" placeholder="Filter residence or staff…"></div><div id="acc">${hs.map((h,i)=>homeCard(h,i===0)).join('')}</div>`;filter.oninput=()=>{const q=filter.value.toLowerCase();document.querySelectorAll('.acc').forEach(a=>a.style.display=a.dataset.search.includes(q)?'block':'none')};}
function homeCard(h,open){const rows=staffForRes(h);const search=(h+' '+rows.map(x=>x.s.name).join(' ')).toLowerCase();return `<section class="acc ${open?'open':''}" data-search="${esc(search)}"><button class="acc-h" onclick="this.parentElement.classList.toggle('open')"><span class="chev">▶</span><div class="ah"><h3>${esc(h)}</h3><div class="meta">${rows.length} staff record${rows.length===1?'':'s'}</div></div></button><div class="acc-b"><div class="accgrid">${rows.map(x=>`<button class="staffrow" onclick="openStaff('${x.s.id}','${esc(h).replace(/'/g,"&#39;")}')"><span class="ini">${esc(ini(x.s.name))}</span><span class="nm">${esc(x.s.name)}<span class="sub" style="display:block">${esc(x.s.title||'')}</span></span>${x.r.is_shabbos_staff?'<span class="pill">Shabbos</span>':''}<span class="pill ${certsFor(x.s,h).length?'done':''}">${certsFor(x.s,h).length} training${certsFor(x.s,h).length===1?'':'s'}</span></button>`).join('')}</div></div></section>`}
function openStaff(id,res){const s=staffById(id);const r=RES.find(x=>x.staff_id===id&&x.residence===res);if(!s||!r)return;const cs=certsFor(s,res),ss=signsFor(s,res);drawer.innerHTML=`<div class="dh"><div class="who"><span class="ini" style="width:44px;height:44px">${esc(ini(s.name))}</span><div><h2>${esc(s.name)}</h2><div class="sub">Employee #${esc(s.employee_number)} · ${esc(s.title||'')}</div><div class="sub">${esc(res)}</div></div><button class="x" onclick="closeDrawer()">×</button></div></div><div class="dbody"><div class="sectionlab">Training history</div>${cs.length?cs.map(c=>`<div class="hist"><span class="dot"></span><div><b>${esc(c.individual_name||'Training')}</b></div><span class="date">${esc(fmt(c.completed_at))}</span></div>`).join(''):'<div class="empty">No training on file for this residence.</div>'}${r.is_shabbos_staff?`<div class="shabbox"><div class="sectionlab">Shabbos Policy</div>${ss.length?ss.map(x=>`<div class="hist"><span class="dot"></span><div><b>Shabbos Policy Sign-Off</b><div class="sub">Entered as ${esc(x.name)}</div></div><span class="date">${esc(fmt(x.signed_at))}</span></div>`).join(''):'<div class="empty">No Shabbos sign-off on file yet.</div>'}</div>`:''}</div>`;scrim.classList.add('on');drawer.classList.add('on')}
function candidates(sign){return staffForRes(sign.home).slice(0,30)}
function renderReview(){const list=SIGNS.filter(s=>s.match_status==='needs_review');view.innerHTML=`<div class="crumb">Staff / Needs Review</div><div class="head"><div><h1>Needs Review</h1><p>Only Shabbos sign-offs that cannot be matched confidently appear here. Nothing is discarded.</p></div></div>${list.length?list.map(s=>`<div class="reviewcard"><div class="reviewtop"><span class="ini">${esc(ini(s.name))}</span><div class="who"><b>Entered as: ${esc(s.name)}</b><span>QR residence: ${esc(s.home)} · ${esc(fmt(s.signed_at))}</span></div><span class="pill warn">Needs match</span></div><div class="candidates">${candidates(s).map(x=>`<div class="candidate"><span class="ini">${esc(ini(x.s.name))}</span><div class="grow"><b>${esc(x.s.name)}</b><span>Employee #${esc(x.s.employee_number)} · ${esc(x.s.title||'')}</span><span>Home residence: ${esc(x.r.residence)}</span></div><button class="matchbtn" onclick="matchSignoff('${s.id}','${x.s.id}','${esc(x.r.residence).replace(/'/g,"&#39;")}')">Match here</button></div>`).join('')}</div></div>`).join(''):'<div class="empty">Nothing needs review.</div>'}`}
async function matchSignoff(signId,staffId,res){const user=(await SB.auth.getUser()).data.user;let r=await SB.from('shabbos_signoffs').update({matched_staff_id:staffId,match_status:'matched',matched_by:user?.email||null,matched_at:new Date().toISOString()}).eq('id',signId);if(r.error)return toast(r.error.message);r=await SB.from('staff_residences').update({is_shabbos_staff:true}).eq('staff_id',staffId).eq('residence',res);if(r.error)return toast(r.error.message);await load();nav();go('review');toast('Matched')}
function renderCoverage(){const hs=residenceNames();view.innerHTML=`<div class="crumb">Staff / Staffing & Coverage</div><div class="head"><div><h1>Staffing & Coverage</h1><p>Morning, Evening, Night, Overnight Awake, Overnight Asleep, Shabbos, and the shared coverage pool.</p></div></div>${hs.map(h=>`<section class="coverage-home"><div class="coverage-home-h"><div><h3>${esc(h)}</h3><div class="meta">Residence staffing</div></div></div><div class="shiftgrid">${SHIFTTYPES.map(t=>shiftCard(h,t)).join('')}</div></section>`).join('')}<section class="pool"><div class="pool-h"><h3>Available Staff Pool</h3><p>Staff marked available for coverage.</p></div><div class="poolgrid">${RES.filter(r=>r.coverage_pool).map(r=>{const s=staffById(r.staff_id);return s?`<div class="poolrow"><span class="ini">${esc(ini(s.name))}</span><div class="grow"><b>${esc(s.name)}</b><span>${esc(r.residence)} · ${esc(s.title||'')}</span></div></div>`:''}).join('')||'<div class="empty">No staff marked available.</div>'}</div></section>`}
function shiftCard(res,type){const a=assignmentFor(res,type),s=a?staffById(a.staff_id):null;return `<div class="shiftcard"><h4>${esc(type)}</h4><div class="when">${type==='Shabbos'?'Friday night / Shabbos day':'Residence assignment'}</div>${s?`<div class="assignment"><span class="ini">${esc(ini(s.name))}</span><div class="grow"><b>${esc(s.name)}</b><span>${esc(s.title||'')}</span></div></div><button class="softaction" onclick="removeShift('${a.id}')">Remove assignment</button>`:`<div class="emptyshift">No staff assigned</div><select style="width:100%;height:40px;margin-top:8px;border:1px solid #d2dce3;border-radius:9px"><option value="">Choose staff…</option>${staffForRes(res).map(x=>`<option value="${x.s.id}">${esc(x.s.name)}</option>`).join('')}</select><button class="softaction" onclick="addShift('${esc(res).replace(/'/g,"&#39;")}','${esc(type)}',this.previousElementSibling.value)">Assign staff</button>`}</div>`}
async function addShift(res,type,staffId){if(!staffId)return toast('Choose staff');const user=(await SB.auth.getUser()).data.user;const r=await SB.from('staff_shift_assignments').insert({residence:res,shift_type:type,staff_id:staffId,created_by:user?.email||null});if(r.error)return toast(r.error.message);await load();go('coverage');toast('Assigned')}
async function removeShift(id){if(!confirm('Remove this shift assignment?'))return;const r=await SB.from('staff_shift_assignments').delete().eq('id',id);if(r.error)return toast(r.error.message);await load();go('coverage');toast('Removed')}
function renderManage(){view.innerHTML=`<div class="crumb">Staff / Manage Staff</div><div class="head"><div><h1>Manage Staff</h1><p>Add staff, assign them to residences, remove residence assignments, and control the coverage pool.</p></div></div><div class="form"><div class="fld"><label>Name</label><input id="mn"></div><div class="fld"><label>Employee #</label><input id="me"></div><div class="fld"><label>Title</label><input id="mt"></div><button class="addbtn" onclick="addStaff()">Add Staff</button></div><div class="controls"><select id="mr"><option value="">Choose residence…</option>${residenceNames().map(h=>`<option>${esc(h)}</option>`).join('')}</select><select id="ms"><option value="">Choose staff…</option>${STAFF.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}">${esc(s.name)} #${esc(s.employee_number)}</option>`).join('')}</select><button class="btn primary" onclick="addResidence()">Add to residence</button></div><div class="tbl"><div class="tr h" style="grid-template-columns:1.4fr 1fr 1.2fr .7fr auto"><span>Staff</span><span>Employee #</span><span>Residence</span><span>Coverage</span><span></span></div>${RES.slice().sort((a,b)=>a.residence.localeCompare(b.residence)).map(r=>{const s=staffById(r.staff_id);if(!s)return'';return `<div class="tr r" style="grid-template-columns:1.4fr 1fr 1.2fr .7fr auto"><strong>${esc(s.name)}</strong><span>${esc(s.employee_number)}</span><span>${esc(r.residence)}</span><button class="btn" onclick="togglePool('${r.id}',${!r.coverage_pool})">${r.coverage_pool?'Available':'Not available'}</button><button class="rmv" onclick="removeResidence('${r.id}','${esc(s.name).replace(/'/g,"&#39;")}','${esc(r.residence).replace(/'/g,"&#39;")}')">Remove</button></div>`}).join('')}</div>`}
async function addStaff(){const name=mn.value.trim(),employee_number=me.value.trim(),title=mt.value.trim();if(!name||!employee_number)return toast('Name and employee # required');const r=await SB.from('staff').insert({name,employee_number,title:title||null});if(r.error)return toast(r.error.message);await load();go('manage');toast('Staff added')}
async function addResidence(){if(!mr.value||!ms.value)return toast('Choose residence and staff');const r=await SB.from('staff_residences').insert({staff_id:ms.value,residence:mr.value});if(r.error)return toast(r.error.message);await load();go('manage');toast('Residence added')}
async function removeResidence(id,name,res){if(!confirm(`Remove ${name} from ${res}?`))return;const r=await SB.from('staff_residences').delete().eq('id',id);if(r.error)return toast(r.error.message);await load();go('manage');toast('Residence removed')}
async function togglePool(id,val){const r=await SB.from('staff_residences').update({coverage_pool:val}).eq('id',id);if(r.error)return toast(r.error.message);await load();go('manage')}
async function load(){let q=await Promise.all([SB.from('staff').select('*'),SB.from('staff_residences').select('*'),SB.from('certificates').select('id,residence,dsp_name,individual_name,completed_at,is_archived'),SB.from('shabbos_signoffs').select('*'),SB.from('staff_shift_assignments').select('*')]);for(const x of q)if(x.error)throw x.error;[STAFF,RES,CERTS,SIGNS,SHIFTS]=q.map(x=>x.data||[])}
async function init(){for(let i=0;i<30&&!window.__hascClient;i++)await new Promise(r=>setTimeout(r,100));SB=window.__hascClient||supabase.createClient(HASC_CONFIG.SUPABASE_URL,HASC_CONFIG.SUPABASE_ANON_KEY);try{await load();nav();go('homes');['staff','staff_residences','certificates','shabbos_signoffs','staff_shift_assignments'].forEach(t=>SB.channel('staff-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},async()=>{await load();nav();go(CURRENT)}).subscribe())}catch(e){view.innerHTML=`<div class="empty">Could not load Staff data: ${esc(e.message)}</div>`}}
init();
</script></body></html>
