<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HASC Overtime Dashboard</title>
<style>html,body{margin:0;padding:0;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}body{min-height:100vh}</style>
</head>
<body>
<script>
(async()=>{
  const parts=[];
  for(let i=1;i<=7;i++){
    const r=await fetch(`ot-payload/${i}.txt`,{cache:'no-store'});
    if(!r.ok) throw new Error(`Missing Overtime payload ${i}`);
    parts.push((await r.text()).trim());
  }
  const b64=parts.join('');
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<div style="padding:20px;color:#991b1b">Overtime app failed to load: '+String(err)+'</div>';
});
</script>
</body>
</html>
