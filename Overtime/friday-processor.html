<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRIDAY OT Processor</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/wb-config.js"></script><style>body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a}.wrap{max-width:1500px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row h2{margin:0 auto 0 0}.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:700;background:#0f5ea8;color:#fff}.btn:disabled{opacity:.45}.status{font-size:13px}.stats{display:flex;gap:24px;flex-wrap:wrap}.stat b{font-size:22px;display:block}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}th{font-size:11px;text-transform:uppercase;color:#6b7280}.num{text-align:right}.good{color:#16834b;font-weight:700}.bad{color:#b42318;font-weight:700}iframe{width:100%;height:900px;border:0;background:#fff;border-radius:14px}</style></head><body><div class="wrap"><div class="card"><div class="row"><div><h2>FRIDAY OT Processor</h2><div class="status">Raw HR payroll → residence totals → existing OT dashboard</div></div><input id="file" type="file" accept=".csv,text/csv"><button id="process" class="btn" disabled>Process Payroll</button></div><div id="status" class="status" style="margin-top:12px">Choose the raw HR overtime CSV. Nothing changes until Process Payroll is clicked.</div></div><div class="card"><div class="stats"><div class="stat"><b id="rows">0</b>OT rows</div><div class="stat"><b id="homes">0</b>Residences</div><div class="stat"><b id="hours">0.00</b>OT hours</div><div class="stat"><b id="miss">0</b>Needs attention</div></div></div><div class="card" style="padding:0;overflow:auto;max-height:460px"><table><thead><tr><th>Residence</th><th>HR Department</th><th class="num">OT Hours</th><th>Status</th></tr></thead><tbody id="results"><tr><td colspan="4">No payroll processed yet.</td></tr></tbody></table></div><div class="card"><b>Existing OT Dashboard</b></div><iframe src="/Overtime/dashboard.html" title="Existing OT Dashboard"></iframe></div><script src="/Overtime/friday-processor.js?v=1"></script></body></html>
