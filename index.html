<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>HASC Residential OS — FRIDAY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/wb-config.js"></script>
  <script src="/wb-guard.js"></script>
  <link rel="stylesheet" href="/assets/friday-index.css">
</head>
<body>
  <header class="topbar index-topbar">
    <div class="index-brand"><img src="/hasc-logo.png" alt="HASC Center"></div>
    <div class="index-divider"></div>
    <div class="index-dept">Residential</div>
    <div class="index-topright">
      <div class="index-datetime"><b id="indexDate"></b><span id="indexClock"></span></div>
      <div class="index-divider small"></div>
      <div class="avatar" id="userInitials">—</div>
      <div class="index-usertext"><b id="userName">Loading…</b><span id="userRole">—</span></div>
      <button class="index-iconbtn" id="logoutBtn" aria-label="Sign out">↪</button>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <nav class="nav" id="navRail"></nav>
      <div class="rail-foot"><button class="navbtn" id="appsLauncher"><span class="navico">▦</span>Apps</button></div>
    </aside>

    <main class="main">
      <div class="content">
        <section class="view active" id="view-dashboard">
          <div class="welcome">
            <h2><span id="greetWord">Hello</span>, <span id="firstName">there</span> <span class="wave">👋</span></h2>
            <p>Here’s your Residential workspace for <b id="welcomeHome">your homes</b>.</p>
          </div>

          <div class="residence-hero panel">
            <div>
              <div class="eyebrow">My Residence</div>
              <h2 id="heroHomeName">Loading residence…</h2>
              <div class="resmeta"><span><b>RM</b> <span id="heroRM">—</span></span><span><b>COORDINATOR</b> <span id="heroAC">—</span></span></div>
              <div class="resaddr" id="heroAddress">—</div>
            </div>
            <select class="btn" id="heroHomeFilter"></select>
          </div>

          <section class="panel">
            <div class="ph"><h3>Houses at a Glance</h3><span class="minor" id="houseCount"></span></div>
            <div class="houses" id="houses"></div>
          </section>

          <section class="panel">
            <div class="ph"><h3>Apps</h3><span class="minor">FRIDAY modular shell</span></div>
            <div class="appgrid" id="appGrid"></div>
          </section>
        </section>

        <section class="view" id="view-app">
          <div class="viewhead">
            <div><h2 id="appTitle">App</h2><p id="appSub">Embedded HASC OS app</p></div>
            <div class="push"><button class="btn" id="backDashboard">Dashboard</button></div>
          </div>
          <iframe id="appFrame" title="HASC OS app"></iframe>
        </section>
      </div>
    </main>
  </div>

  <div class="appsmenu-backdrop" id="appsMenuBk"></div>
  <div class="appsmenu" id="appsMenu">
    <div class="appsmenu-head"><h3>Apps</h3><span>Pin apps to your left rail</span></div>
    <div id="appsPin"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/js/friday-index.js"></script>
</body>
</html>
