<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f1efe9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>HASC Residential OS</title>
<style>
:root{
  --ui:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --paper:#f1efe9;--card:#fff;--ink:#233038;--ink2:#3a4a54;--muted:#6a7a84;--faint:#9fb0b8;
  --line:#e7e2d9;--line2:#eef1f4;--teal:#17a2b8;--teal-ink:#0f7d8f;--teal-wash:#e8f6f8;
  --green:#568E62;--blue:#3E9EB3;--plum:#AC659D;--gold:#D9B93B;--coral:#C96A44;--red:#D52B1E;
  --slate:#5b7a99;--indigo:#5E6FB2;--jade:#3E9E86;--rose:#C67BA0;--violet:#7C5192;
  --shadow:0 1px 2px rgba(60,50,35,.04),0 12px 30px -18px rgba(60,50,35,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
position:fixed;inset:0;width:100%;height:100%;min-height:100%;max-height:100%;
margin:0;overflow:hidden;overscroll-behavior:none;background:var(--paper);
touch-action:none;-webkit-overflow-scrolling:auto;
}
html{height:100dvh;max-height:100dvh}
body{height:100dvh;max-height:100dvh}
body{font-family:var(--ui);color:var(--ink);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

.app{
position:fixed;inset:0;width:100%;height:100dvh;max-height:100dvh;max-width:560px;
margin:0 auto;display:flex;flex-direction:column;background:var(--paper);
overflow:hidden;overscroll-behavior:none;touch-action:none;
}

/* MOBILE HEADER — copied from Mark 4 visual language, not desktop layout */
.header{height:72px;padding:env(safe-area-inset-top) 14px 0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:34px;max-width:122px;display:block}
.divider{width:1px;height:28px;background:var(--line);flex:none}
.dept{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);white-space:nowrap}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.logoutbtn{
width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;
color:var(--muted);display:grid;place-items:center
}
.logoutbtn svg{width:16px;height:16px}
.logoutbtn:active{transform:scale(.96)}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:850}


/* ORIGINAL MARK 5 MOBILE STRUCTURE */
.house-zone{height:42%;min-height:0;padding:12px 13px 10px;flex:none;overflow:hidden}
.house-card{height:100%;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.house-top{padding:12px 13px 10px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.house-icon{width:38px;height:38px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -9px var(--teal)}
.house-icon svg{width:19px;height:19px}
.house-copy{min-width:0}
.eyebrow{font-size:9px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-ink);margin-bottom:3px}
.house-name{font-size:19px;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.house-meta{font-size:10.5px;color:var(--muted);margin-top:3px}
.scope{margin-left:auto;background:var(--teal-wash);color:var(--teal-ink);font-size:8.5px;font-weight:900;padding:5px 7px;border-radius:999px}

.residents{padding:9px 9px 10px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;overflow:hidden}
.resident{border:1px solid var(--line2);border-radius:11px;padding:8px;background:#fbfcfc;display:grid;grid-template-columns:31px 1fr auto;gap:7px;align-items:center;text-align:left}
.pball{width:31px;height:31px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}
.resident b{font-size:11.5px}
.resident small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.chev{color:var(--faint);font-size:16px}

.apps-zone{flex:1;min-height:0;background:#fff;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -8px 28px -24px rgba(35,48,56,.3);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
.apps-head{height:44px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line2);flex:none}
.apps-head h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.055em;font-weight:900}
.apps-head span{margin-left:auto;font-size:9px;color:var(--faint);font-weight:900;letter-spacing:.08em}
.pages{display:flex;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;flex:1;min-height:0;touch-action:pan-x}
.pages::-webkit-scrollbar{display:none}
.page{min-width:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:11px 12px 16px;overflow:hidden}
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.app-btn{border:1px solid var(--line);background:#fff;border-radius:13px;min-height:92px;padding:9px 5px 7px;text-align:center;box-shadow:0 1px 2px rgba(60,50,35,.025)}
.app-icon{width:42px;height:42px;margin:0 auto 7px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -10px var(--acc)}
.app-icon svg{width:21px;height:21px}
.app-btn b{display:block;font-size:10.5px;line-height:1.15}
.app-btn:active,.resident:active{transform:scale(.97)}
.dots{height:23px;display:flex;justify-content:center;align-items:center;gap:6px;flex:none}
.dot{width:6px;height:6px;border-radius:99px;background:#d8d4cc}
.dot.active{width:18px;background:var(--teal)}

@media(min-width:700px){
  body{display:grid;place-items:center}
  .app{position:relative;inset:auto;height:min(900px,96svh);max-height:96svh;border:1px solid var(--line);border-radius:28px;box-shadow:0 25px 70px -35px rgba(0,0,0,.35)}
}
</style>
</head>

<script>
const pages=document.getElementById('pages'),dots=[...document.querySelectorAll('.dot')];
function sync(){const i=Math.round(pages.scrollLeft/pages.clientWidth);dots.forEach((d,n)=>d.classList.toggle('active',n===i));}
pages.addEventListener('scroll',()=>requestAnimationFrame(sync),{passive:true});
window.addEventListener('resize',sync);

// hard mobile viewport lock
let __sx=0,__sy=0;
document.addEventListener('touchstart',e=>{
  if(e.touches&&e.touches.length===1){
    __sx=e.touches[0].clientX;
    __sy=e.touches[0].clientY;
  }
},{passive:true});

document.addEventListener('touchmove',e=>{
  const p=e.target.closest&&e.target.closest('.pages');
  if(!p){e.preventDefault();return;}
  if(e.touches&&e.touches.length===1){
    const dx=e.touches[0].clientX-__sx;
    const dy=e.touches[0].clientY-__sy;
    if(Math.abs(dy)>Math.abs(dx)) e.preventDefault();
  }
},{passive:false});

document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
window.addEventListener('scroll',()=>window.scrollTo(0,0),{passive:false});
window.scrollTo(0,0);

const logoutBtn=document.getElementById('logoutBtn');
if(logoutBtn){
  logoutBtn.addEventListener('click',async()=>{
    try{
      if(window.__hascClient) await window.__hascClient.auth.signOut();
      else if(window.supabase&&window.HASC_CONFIG){
        const c=window.supabase.createClient(window.HASC_CONFIG.SUPABASE_URL,window.HASC_CONFIG.SUPABASE_ANON_KEY);
        await c.auth.signOut();
      }
    }catch(e){}
    try{sessionStorage.clear();}catch(e){}
    window.location.href='/';
  });
}
</script>
