:root{
  --ui:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --canvas:#f1efe9; --paper:#ffffff;
  --ink:#233038; --ink2:#3a4a54; --muted:#6a7a84; --faint:#9fb0b8;
  --line:#e7e2d9; --line2:#eef1f4;
  --teal:#17a2b8; --teal-ink:#0f7d8f; --teal-wash:#e8f6f8;
  --dayhab:#568E62; --dayhab-ink:#39684a; --dayhab-wash:#eef4ef;
  --prevoc:#3E9EB3; --prevoc-ink:#2f7d90; --prevoc-wash:#e9f4f6;
  --supp:#AC659D;   --supp-ink:#7c4470;   --supp-wash:#f6eff4;
  --semp:#C99A2E;   --semp-ink:#8a6a15;   --semp-wash:#faf3e2;
  --gold:#D9B93B; --gold-ink:#8a7415; --gold-wash:#fbf6e4; --warm-line:#f0e6c4;
  --slate:#5b7a99; --slate-ink:#3f5a75; --slate-wash:#eef2f6;
  --red:#D96A54;
  --sh-xs:0 1px 2px rgba(60,50,35,.05);
  --sh:0 1px 2px rgba(60,50,35,.05),0 12px 30px -18px rgba(60,50,35,.20);
  --sh-lift:0 4px 10px -2px rgba(60,50,35,.12),0 18px 40px -14px rgba(60,50,35,.28);
  --topbar:65px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h1,h2,h3,h4{margin:0}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}

.topbar{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 34px;position:sticky;top:0;z-index:20}
.topbar .logo{display:flex;align-items:center;cursor:pointer}
.topbar .logo img{height:30px;width:auto;display:block}
.topbar .rule{width:1px;height:26px;background:var(--line)}
.topbar .brandlabel{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);cursor:pointer}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--paper);color:var(--muted);display:grid;place-items:center;transition:border-color .15s,color .15s}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{border-color:var(--teal);color:var(--teal)}
.clock{text-align:right;line-height:1.25}
.clock .d{font-size:12.5px;font-weight:700;color:var(--ink2)}
.clock .t{font-size:12px;color:var(--faint);font-weight:600}
.me{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--line)}
.me .badge{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;background:var(--teal)}
.me .nm{font-size:14px;font-weight:700;line-height:1.2}
.me .rl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ---------- SHELL ---------- */
.main{max-width:1660px;margin:0 auto;padding:24px 28px 64px;display:flex;flex-direction:column;gap:14px}
.crumb{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--muted);font-weight:700;font-size:13px;padding:0 2px;cursor:pointer;transition:color .15s;align-self:flex-start}
.crumb svg{width:16px;height:16px}
.crumb:hover{color:var(--teal)}
.pagehead{display:flex;align-items:center;gap:12px;margin:2px 0 2px}
.pagehead .pi{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#38b6cb,var(--teal));color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -9px var(--teal)}
.pagehead .pi svg{width:19px;height:19px;stroke:#fff}
.pagehead h1{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.pagehead p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* ---------- PANEL + TABS ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.tabbar{display:flex;align-items:center;gap:14px;padding:4px 18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:15px 10px 13px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:color .15s}
.tab svg{width:15px;height:15px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--teal-ink);border-bottom-color:var(--teal)}
.date-actions{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:13px;padding:9px 13px;border-radius:11px;transition:border-color .15s,box-shadow .12s,transform .12s,background .12s,color .15s}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn:hover{border-color:#cfd8dc;box-shadow:var(--sh-xs);transform:translateY(-1px)}
.btn.today{color:var(--teal-ink)}
.btn.ghosticon{width:37px;height:37px;padding:0;justify-content:center;color:var(--muted)}
.btn.primary{background:linear-gradient(135deg,#38b6cb,var(--teal));border:0;color:#fff;box-shadow:0 6px 16px -5px rgba(23,162,184,.5)}
.btn.primary:hover{box-shadow:0 9px 22px -6px rgba(23,162,184,.58)}
.datebox{min-width:186px;font-weight:700;color:var(--ink);background:var(--paper)}

.workspace{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding:16px 18px 20px}
.wsmain{min-width:0}
.workspace.norail{grid-template-columns:1fr}
@media(max-width:1180px){.workspace{grid-template-columns:1fr}}

/* ---------- LEGEND ---------- */
.legend{display:flex;gap:20px;align-items:center;padding:4px 2px 14px;font-size:12.5px;font-weight:700;color:var(--ink2);flex-wrap:wrap}
.legend .dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}
.legend .dayhab{background:var(--dayhab)} .legend .supp{background:var(--supp)} .legend .prevoc{background:var(--prevoc)} .legend .semp{background:var(--semp)}

/* ---------- TIMELINE ---------- */
.tl-wrap{min-width:0}
.tl{position:relative;height:690px;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.hourline{position:absolute;left:74px;right:10px;border-top:1px dashed #e9e3d8}
.hourlab{position:absolute;left:14px;width:56px;color:var(--muted);font-size:11.5px;font-weight:700;transform:translateY(-7px)}
.act{position:absolute;border:1px solid var(--line);border-left:3px solid;border-radius:11px;padding:8px 11px;font-size:12px;box-shadow:var(--sh-xs);overflow:hidden;cursor:pointer;transition:box-shadow .12s,transform .12s}
.act:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.act .t{font-weight:700;font-size:11px;color:var(--muted)}
.act .n{font-weight:800;font-size:12.5px;letter-spacing:-.1px;margin-top:2px}
.act .m{margin-top:2px;color:var(--muted);font-weight:600}
.act .dots{position:absolute;right:8px;top:6px;color:var(--faint);font-weight:900;letter-spacing:1px;font-size:13px}
.act.dayhab{background:var(--dayhab-wash);border-left-color:var(--dayhab)} .act.dayhab .n{color:var(--dayhab-ink)}
.act.supp{background:var(--supp-wash);border-left-color:var(--supp)} .act.supp .n{color:var(--supp-ink)}
.act.prevoc{background:var(--prevoc-wash);border-left-color:var(--prevoc)} .act.prevoc .n{color:var(--prevoc-ink)}
.act.semp{background:var(--semp-wash);border-left-color:var(--semp)} .act.semp .n{color:var(--semp-ink)}
.act.lunch{background:var(--gold-wash);border-left-color:var(--gold);border-color:var(--warm-line)} .act.lunch .n{color:var(--gold-ink)}
.act.selected{box-shadow:0 0 0 3px rgba(23,162,184,.22),var(--sh)}

/* ---------- DETAILS RAIL ---------- */
.details{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:18px;box-shadow:var(--sh)}
.card h3{font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:-.2px;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between}
.card h3 .x{color:var(--faint);cursor:pointer;font-weight:700}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--paper);color:var(--ink);font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
.field textarea{height:76px;resize:vertical}
.pillrow{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--ink)}
.pill{display:inline-flex;gap:8px;align-items:center}
.mini-dot{width:10px;height:10px;border-radius:50%}
.mini-dot.dayhab{background:var(--dayhab)}.mini-dot.supp{background:var(--supp)}.mini-dot.prevoc{background:var(--prevoc)}.mini-dot.semp{background:var(--semp)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.right-actions{display:flex;gap:10px}
.danger{border:1px solid #f0c9c1;background:var(--paper);color:var(--red);border-radius:10px;padding:9px 13px;font-weight:700;transition:.15s}
.danger:hover{background:#fbeeeb;border-color:var(--red)}
.brain textarea{height:60px}
.brain .brow{display:grid;grid-template-columns:1fr 88px;gap:12px;align-items:end}
.brain .brow button{height:40px}
#brainList{margin-top:12px;display:flex;flex-direction:column;gap:6px}
#brainList .bd{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--ink);line-height:1.4}
#brainList .bd .bdot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none;translate:0 5px}
#brainList .bd .cat{color:var(--faint);font-weight:600}

/* ---------- CONTEXT MENU ---------- */
.ctx{position:fixed;z-index:60;width:210px;border:1px solid var(--line);background:var(--paper);border-radius:12px;box-shadow:var(--sh-lift);padding:6px;display:none}
.ctx button{width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:9px}
.ctx button svg{width:15px;height:15px;stroke:var(--muted)}
.ctx button:hover{background:var(--canvas)}
.ctx .sep{height:1px;background:var(--line);margin:5px 4px}
.ctx button.del{color:var(--red)} .ctx button.del svg{stroke:var(--red)}

.stub{padding:60px 24px;text-align:center;color:var(--muted)}
.stub .si{width:52px;height:52px;border-radius:16px;background:var(--teal-wash);color:var(--teal);display:grid;place-items:center;margin:0 auto 14px}
.stub .si svg{width:24px;height:24px;stroke-width:2}
.stub h3{font-family:var(--display);font-size:18px;color:var(--ink);margin-bottom:6px}
.stub p{max-width:360px;margin:0 auto;font-size:13.5px}

@media(max-width:1180px){.details{display:grid;grid-template-columns:1fr 1fr}.brain{grid-column:1/-1}}
@media(max-width:820px){.main{padding:18px 16px 44px}.topbar{padding:12px 16px}.me .nm,.me .rl,.clock{display:none}.details{display:flex}.tab{padding:13px 7px 11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.act:hover,.btn:hover{transform:none}}
.act.cancelled{opacity:.5} .act.cancelled .n{text-decoration:line-through}
.act .rec{position:absolute;left:11px;bottom:6px;font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.tl.moving{cursor:crosshair;box-shadow:inset 0 0 0 2px rgba(23,162,184,.5)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:var(--sh-lift)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* daily drag + resize */
.act{cursor:grab;user-select:none}
.act.dragging{z-index:6;box-shadow:var(--sh-lift);transition:none;cursor:grabbing}
.act .grip{position:absolute;left:9px;right:9px;bottom:2px;height:7px;border-radius:4px;cursor:ns-resize;opacity:0;background:rgba(35,48,56,.16);transition:opacity .12s}
.act:hover .grip{opacity:1}

/* weekly grid */
#weeklyView{min-width:0}
.wk{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.wkhrow,.wkbody{display:grid;grid-template-columns:60px repeat(4,minmax(0,1fr))}
.wkhrow .c{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.wkhrow .c:last-child{border-right:0}
.wkhead{padding:11px 8px;text-align:center;cursor:pointer;transition:background .15s}
.wkhead:hover{background:var(--canvas)}
.wkhead .dw{font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--muted)}
.wkhead .dd{font-size:12px;color:var(--faint);margin-top:2px}
.wkgutter{position:relative;height:690px;border-right:1px solid var(--line)}
.wkgutter .hourlab{left:9px;width:48px}
.wkcol{position:relative;height:690px;border-right:1px solid var(--line)}
.wkcol:last-child{border-right:0}
.wkcol .hl{position:absolute;left:0;right:0;border-top:1px dashed #ede6da}
.wkact{position:absolute;border:1px solid var(--line);border-left:3px solid;border-radius:9px;padding:6px 8px;overflow:hidden;box-shadow:var(--sh-xs);cursor:grab;user-select:none;transition:box-shadow .12s,transform .12s}
.wkact:hover{box-shadow:var(--sh);transform:translateY(-1px);z-index:3}
.wkact.dragging{cursor:grabbing;box-shadow:var(--sh-lift);transition:none;opacity:.96}
.wkcol.wkdrop{background:rgba(23,162,184,.06)}
.wkact .t{font-weight:700;font-size:10px;color:var(--muted)}
.wkact .n{font-weight:800;font-size:11px;margin-top:1px;line-height:1.15}
.wkact.dayhab{background:var(--dayhab-wash);border-left-color:var(--dayhab)} .wkact.dayhab .n{color:var(--dayhab-ink)}
.wkact.supp{background:var(--supp-wash);border-left-color:var(--supp)} .wkact.supp .n{color:var(--supp-ink)}
.wkact.prevoc{background:var(--prevoc-wash);border-left-color:var(--prevoc)} .wkact.prevoc .n{color:var(--prevoc-ink)}
.wkact.semp{background:var(--semp-wash);border-left-color:var(--semp)} .wkact.semp .n{color:var(--semp-ink)}
.wkact.lunch{background:var(--gold-wash);border-left-color:var(--gold);border-color:var(--warm-line)} .wkact.lunch .n{color:var(--gold-ink)}

/* calendar (month) view */
.calhead{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.caltitle{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.calnav{margin-left:auto;display:flex;gap:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-top-left-radius:14px;border-top-right-radius:14px;overflow:hidden;background:var(--paper)}
.cdow{padding:9px 8px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--canvas)}
.cell{min-height:104px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 6px 7px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell.out{background:#faf8f3}
.cell .dn{font-size:12px;font-weight:700;color:var(--ink2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;margin-bottom:1px}
.cell.out .dn{color:var(--faint)}
.cell.today .dn{background:var(--teal);color:#fff}
.cev{font-size:10.5px;font-weight:700;line-height:1.3;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.cev .cd{width:6px;height:6px;border-radius:50%;flex:none}
.cev.dayhab{background:var(--dayhab-wash);color:var(--dayhab-ink)} .cev.dayhab .cd{background:var(--dayhab)}
.cev.supp{background:var(--supp-wash);color:var(--supp-ink)} .cev.supp .cd{background:var(--supp)}
.cev.prevoc{background:var(--prevoc-wash);color:var(--prevoc-ink)} .cev.prevoc .cd{background:var(--prevoc)}
.cev.semp{background:var(--semp-wash);color:var(--semp-ink)} .cev.semp .cd{background:var(--semp)}
.cev.fed{background:var(--slate-wash);color:var(--slate-ink)} .cev.fed .cd{background:var(--slate)}
.cev.yt{background:var(--supp-wash);color:var(--supp-ink);font-weight:800} .cev.yt .cd{background:var(--supp)}
.cev.min{background:#f4eff7;color:var(--supp-ink)} .cev.min .cd{background:#c483b7}
.cev.candle{background:var(--gold-wash);color:var(--gold-ink)} .cev.candle .cd{background:var(--gold)}
.cmore{font-size:10px;font-weight:700;color:var(--muted);padding:1px 6px}
/* calendar toggle list */
.caltog{display:flex;flex-direction:column;gap:2px}
.caltog label{display:flex;align-items:center;gap:11px;padding:7px 6px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink)}
.caltog label:hover{background:var(--canvas)}
.caltog input{display:none}
.caltog .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--c,#ccc);display:grid;place-items:center;flex:none;transition:background .12s,border-color .12s}
.caltog input:checked + .box{background:var(--c);border-color:var(--c)}
.caltog .box svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;opacity:0}
.caltog input:checked + .box svg{opacity:1}

/* ---------- BOOKINGS BOARD ---------- */
.booking-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:4px 2px 14px}
.sumcard{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--paper);box-shadow:var(--sh-xs)}
.sumcard .sv{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.03em}.sumcard .sl{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.sumcard.attn{background:#fff9f4;border-color:#f0ddd2}.sumcard.attn .sv{color:#b65b45}.sumcard.ready{background:var(--dayhab-wash);border-color:#d9e8dc}.sumcard.ready .sv{color:var(--dayhab-ink)}
.bookboard{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:6px}
.bookday{border:1px solid var(--line);border-radius:14px;background:#fbfaf7;min-height:520px;overflow:hidden}
.bookday-head{padding:12px 13px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:space-between}
.bookday-head .dw{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}.bookday-head .dt{font-size:13.5px;font-weight:800;color:var(--ink);margin-top:1px}.bookday-head .cnt{font-size:10.5px;font-weight:800;color:var(--faint);background:var(--canvas);padding:4px 7px;border-radius:999px}
.booklist{padding:9px;display:flex;flex-direction:column;gap:9px}
.booking{border:1px solid var(--line);border-left:4px solid var(--dayhab);border-radius:12px;background:var(--paper);padding:11px 11px 10px;box-shadow:var(--sh-xs);cursor:pointer;transition:box-shadow .12s,transform .12s,border-color .12s}
.booking:hover{box-shadow:var(--sh);transform:translateY(-1px)}.booking.selected{box-shadow:0 0 0 3px rgba(23,162,184,.18),var(--sh);border-color:#bfe0e5}.booking.supp{border-left-color:var(--supp)}.booking.prevoc{border-left-color:var(--prevoc)}.booking.semp{border-left-color:var(--semp)}
.booking .btop{display:flex;gap:8px;align-items:flex-start}.booking .btime{font-size:12px;font-weight:700;color:var(--muted)}.booking .bname{font-size:13px;font-weight:800;color:var(--ink);margin-top:2px;line-height:1.25}.booking .bmeta{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}.booking .bdots{margin-left:auto;color:var(--faint);font-weight:900}
.status{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;padding:4px 7px;border-radius:999px;margin-top:8px}.status.need{background:#fff1ec;color:#b65b45}.status.progress{background:var(--gold-wash);color:var(--gold-ink)}.status.confirmed{background:var(--dayhab-wash);color:var(--dayhab-ink)}
.progressbar{height:5px;background:#eee9df;border-radius:999px;overflow:hidden;margin-top:10px}.progressbar span{display:block;height:100%;background:var(--teal);border-radius:999px}.proglabel{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-weight:700;margin-top:5px}
.minitasks{display:flex;flex-direction:column;gap:5px;margin-top:9px}.minitask{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink2);font-weight:600}.minitask .ck{width:14px;height:14px;border:1.5px solid #cfd7da;border-radius:4px;display:grid;place-items:center;flex:none}.minitask.done{color:var(--faint);text-decoration:line-through}.minitask.done .ck{background:var(--teal);border-color:var(--teal);color:#fff;font-size:10px}
.emptyday{padding:28px 10px;text-align:center;color:var(--faint);font-size:11.5px;font-weight:600}
.bookdetail .badge-line{display:flex;align-items:center;gap:7px;margin:-6px 0 14px;font-size:11px;font-weight:800;color:var(--muted)}
.checklist{display:flex;flex-direction:column;gap:10px}
.field label.checkrow{
  display:grid;
  grid-template-columns:22px minmax(0,1fr) max-content;
  column-gap:14px;
  align-items:center;
  width:100%;
  margin:0;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--paper);
  min-height:58px;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:0;
  color:var(--ink);
  cursor:pointer;
}
.field label.checkrow:hover{background:#fcfbf8}
.field label.checkrow input[type="checkbox"]{
  appearance:none;
  -webkit-appearance:none;
  width:20px!important;
  height:20px!important;
  min-width:20px;
  margin:0!important;
  padding:0!important;
  border:1.8px solid #7d8a91;
  border-radius:4px;
  background:#fff;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.field label.checkrow input[type="checkbox"]:checked{background:var(--teal);border-color:var(--teal)}
.field label.checkrow input[type="checkbox"]:checked::after{
  content:'✓';
  color:#fff;
  font-size:14px;
  font-weight:900;
  line-height:1;
}
.field label.checkrow>span:not(.ctag){
  min-width:0;
  line-height:1.35;
  overflow-wrap:break-word;
  padding:0;
  color:var(--ink);
  font-weight:700;
}
.field label.checkrow .ctag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  border-radius:999px;
  padding:5px 9px;
  margin:0;
  border:1px solid rgba(23,162,184,.20);
  background:var(--teal-wash);
  color:var(--teal-ink);
}
.field label.checkrow .ctag.transportation{background:#edf5fc;color:#2b69a8;border-color:#c8def4}
.field label.checkrow .ctag.staff{background:#f3eefb;color:#6245b5;border-color:#dcd0f4}
.field label.checkrow .ctag.program{background:#f3f1ed;color:#617078;border-color:#dedad2}

.addtask{display:flex;gap:8px;margin-top:9px}.addtask input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12.5px}.addtask button{padding:8px 11px}
.viewfilter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.vf{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 10px;font-size:11.5px;font-weight:700;color:var(--muted)}.vf.active{background:var(--teal-wash);border-color:#cfe8ec;color:var(--teal-ink)}
@media(max-width:980px){.booking-summary{grid-template-columns:repeat(2,1fr)}.bookboard{grid-template-columns:repeat(4,240px)}}


/* ---------- BOOKINGS DRAG + ACTION MENU ---------- */
.booking{cursor:grab}
.booking.dragging{opacity:.58;box-shadow:var(--sh-lift);transform:rotate(.5deg);cursor:grabbing}
.bookday.drop-target{border-color:var(--teal);box-shadow:inset 0 0 0 2px rgba(23,162,184,.12);background:#f7fcfd}
.booking.drop-before{box-shadow:0 -3px 0 var(--teal),var(--sh-xs)}
.booking .bdots{
  width:28px;height:28px;border-radius:8px;
  display:grid;place-items:center;
  cursor:pointer;
  user-select:none;
  font-size:16px;
  line-height:1;
}
.booking .bdots:hover{background:var(--canvas);color:var(--ink)}
.ctx.booking-menu{width:244px}
.ctx .menu-label{padding:7px 11px 5px;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ctx button svg{flex:none}


.booking .bdots{width:32px;height:32px;font-size:18px;border-radius:9px}
@media(max-width:1380px){
  .workspace{grid-template-columns:minmax(0,1fr) 360px}
}
@media(max-width:1100px){
  .workspace{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .board{grid-template-columns:1fr}
  .minitasks{grid-template-columns:1fr}
}

</style>

          <div class="field"><label>Activity</label><input id="fActivity" value="Bowling"></div>

            <div class="field"><label>Service</label><select id="fService"><option>Day Hab</option><option>Supplemental Day Hab</option><option>Community Prevoc</option><option>SEMP</option></select></div>
            <div class="field"><label>Day</label><select id="fDay"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option></select></div>
          </div>
          <div class="frow">
            <div class="field"><label>Start Time</label><input id="fStartTime" type="time" step="900" value="14:00"></div>
            <div class="field"><label>End Time</label><input id="fEndTime" type="time" step="900" value="15:30"></div>
          </div>
          <div class="frow">
            <div class="field"><label>Status</label><select id="fStatus"><option value="need">Needs Booking</option><option value="progress" selected>In Progress</option><option value="confirmed">Confirmed</option></select></div>
            <div class="field"><label>Due Date</label><input id="fDue" value="Jan 6, 2026"></div>
          </div>
          <div class="field"><label>Venue / Vendor</label><input id="fVenue" value="Maple Lanes"></div>
          <div class="frow">
            <div class="field"><label>Contact</label><input id="fContact" value="David · 516-555-0182"></div>
            <div class="field"><label>Estimated Cost</label><input id="fCost" value="$180"></div>
          </div>
          <div class="field"><label>Confirmation # / Reference</label><input id="fConfirm" placeholder="Add when confirmed"></div>
          <div class="field"><label>Notes</label><textarea id="fNotes">Confirm two lanes and shoe rental. Ask about accessibility entrance.</textarea></div>
          <div class="field"><label>Preparation Checklist</label><div class="checklist" id="detailChecklist"></div><div class="addtask"><input id="newTask" placeholder="Add prep item…"><button class="btn" id="addTask">Add</button></div></div>
          <div class="actions"><button class="danger" id="cancelBooking">Cancel Booking</button><div class="right-actions"><button class="btn" id="resetBtn">Reset</button><button class="btn primary" id="saveBtn">Save</button></div></div>
        </div>

        <div class="card brain">
          <h3>Quick Add · Booking Note</h3>
          <div class="field"><textarea id="quickText" placeholder="Call JCC about Food Pantry…"></textarea></div>
          <div class="brow"><div class="field" style="margin:0"><label>Attach to</label><select id="quickAttach"></select></div><button class="btn primary" id="quickAdd">Add</button></div>
          <div id="brainList"></div>
        </div>

    </div>
  </section>
</main>
<div class="ctx booking-menu" id="bookingMenu"></div>
<div class="toast" id="toast"></div>

<script>
const TABS=[
 ['week','This Week','<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'],
 ['need','Needs Booking','<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.6 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/>'],
 ['confirmed','Confirmed','<path d="M20 6 9 17l-5-5"/>'],
 ['completed','Completed','<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>']
];
document.getElementById('tabs').innerHTML=TABS.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${t[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t[2]}</svg>${t[1]}</button>`).join('');

const DAYS=[['MON','Jan 5'],['TUE','Jan 6'],['WED','Jan 7'],['THU','Jan 8']];
let bookings=[
 {id:1,day:0,time:'10:00–12:00',name:'Food Pantry',service:'Community Prevoc',status:'confirmed',venue:'JCC Food Pantry',contact:'Sarah · 516-555-0104',cost:'$0',due:'Jan 4, 2026',confirm:'FP-0105',notes:'Bring reusable bags.',tasks:[['Confirm volunteer slot',1,'Booking'],['Confirm participant list',1,'Program'],['Send staff instructions',0,'Staff']]},
 {id:2,day:0,time:'1:30–3:00',name:'Community Outing',service:'Supplemental Day Hab',status:'need',venue:'TBD',contact:'',cost:'',due:'Jan 5, 2026',confirm:'',notes:'Choose destination and make reservation.',tasks:[['Choose destination',0,'Program'],['Call venue',0,'Booking'],['Confirm cost',0,'Booking']]},
 {id:3,day:1,time:'10:00–12:00',name:'Jus by Julie',service:'Community Prevoc',status:'confirmed',venue:'Jus by Julie',contact:'Manager',cost:'$0',due:'Jan 5, 2026',confirm:'JJ-106',notes:'Volunteer shift.',tasks:[['Confirm shift',1,'Booking'],['Send participant count',1,'Program']]},
 {id:4,day:1,time:'2:00–3:30',name:'Bowling',service:'Supplemental Day Hab',status:'progress',venue:'Maple Lanes',contact:'David · 516-555-0182',cost:'$180',due:'Jan 6, 2026',confirm:'',notes:'Confirm two lanes and shoe rental. Ask about accessibility entrance.',tasks:[['Call bowling alley',1,'Booking'],['Confirm reservation',0,'Booking'],['Arrange transportation',0,'Transportation'],['Assign staff',1,'Staff']]},
 {id:5,day:2,time:'10:00–12:00',name:'Library Volunteer',service:'Community Prevoc',status:'progress',venue:'Cedarhurst Library',contact:'Miriam',cost:'$0',due:'Jan 7, 2026',confirm:'',notes:'Confirm volunteer tasks for this week.',tasks:[['Email library',1,'Booking'],['Confirm activity plan',0,'Program']]},
 {id:6,day:2,time:'2:00–3:00',name:'Music Therapy',service:'Supplemental Day Hab',status:'confirmed',venue:'On Site',contact:'Rachel',cost:'$125',due:'Jan 5, 2026',confirm:'MT-107',notes:'Recurring weekly session.',tasks:[['Confirm therapist',1,'Booking']]},
 {id:7,day:3,time:'10:00–12:00',name:'Food Pantry',service:'Community Prevoc',status:'need',venue:'JCC Food Pantry',contact:'',cost:'$0',due:'Jan 8, 2026',confirm:'',notes:'Thursday volunteer slot not confirmed yet.',tasks:[['Call JCC',0,'Booking'],['Confirm time',0,'Booking']]},
 {id:8,day:3,time:'3:00–4:00',name:'Movie',service:'Supplemental Day Hab',status:'need',venue:'TBD',contact:'',cost:'',due:'Jan 8, 2026',confirm:'',notes:'Decide whether on-site or theater.',tasks:[['Choose movie / venue',0,'Program'],['Book if off-site',0,'Booking']]}
];
let selected=4,filter='all';
const svcClass=s=>({'Day Hab':'dayhab','Supplemental Day Hab':'supp','Community Prevoc':'prevoc','SEMP':'semp'}[s]||'dayhab');
const statusLabel=s=>s==='need'?'Needs Booking':s==='progress'?'In Progress':'Confirmed';

function parseRange(str){
  const parts=String(str||'').split('–').map(s=>s.trim());
  function to24(s){
    const m=s.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
    if(!m)return '09:00';
    let h=+m[1], min=m[2], ap=(m[3]||'').toUpperCase();
    if(ap==='PM'&&h<12)h+=12;
    if(ap==='AM'&&h===12)h=0;
    return String(h).padStart(2,'0')+':'+min;
  }
  return [to24(parts[0]),to24(parts[1]||parts[0])];
}
function fmtTime24(v){
  const [hs,ms]=String(v||'09:00').split(':'); let h=+hs, m=ms||'00';
  const ap=h>=12?'PM':'AM'; let d=h%12;if(d===0)d=12;
  return `${d}:${m} ${ap}`;
}
function makeRange(start,end){return `${fmtTime24(start)}–${fmtTime24(end)}`;}
function updateDetailSummary(){
  const svc=fService.value, di=+fDay.value;
  serviceDot.className='mini-dot '+svcClass(svc);
  detailSummary.textContent=`${svc} · ${DAYS[di][0]} · ${makeRange(fStartTime.value,fEndTime.value)}`;
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function progress(a){return a.tasks.length?Math.round(a.tasks.filter(t=>t[1]).length/a.tasks.length*100):100}
function visible(a){return filter==='all'||a.status===filter}
let draggedBooking=null, suppressBookingClick=false;

function render(){
 const board=document.getElementById('board'); board.innerHTML='';
 DAYS.forEach((d,di)=>{
   const all=bookings.filter(a=>a.day===di&&visible(a));
   const col=document.createElement('div');
   col.className='bookday';
   col.dataset.day=di;
   col.innerHTML=`<div class="bookday-head"><div><div class="dw">${d[0]}</div><div class="dt">${d[1]}</div></div><span class="cnt">${all.length} ${all.length===1?'activity':'activities'}</span></div><div class="booklist"></div>`;
   const list=col.querySelector('.booklist');
   if(!all.length)list.innerHTML='<div class="emptyday">Drop an activity here</div>';

   col.addEventListener('dragover',e=>{
     if(draggedBooking==null)return;
     e.preventDefault();
     col.classList.add('drop-target');
   });
   col.addEventListener('dragleave',e=>{
     if(!col.contains(e.relatedTarget))col.classList.remove('drop-target');
   });
   col.addEventListener('drop',e=>{
     if(draggedBooking==null)return;
     e.preventDefault();
     const beforeCard=e.target.closest('.booking');
     moveBookingToDay(draggedBooking,di,beforeCard?+beforeCard.dataset.id:null);
     draggedBooking=null;
     suppressBookingClick=true;
     setTimeout(()=>suppressBookingClick=false,80);
     render(); loadDetail();
   });

   all.forEach(a=>{
     const p=progress(a),done=a.tasks.filter(t=>t[1]).length;
     const card=document.createElement('div');
     card.className=`booking ${svcClass(a.service)} ${a.id===selected?'selected':''}`;
     card.dataset.id=a.id;
     card.draggable=true;
     card.innerHTML=`<div class="btop"><div><div class="btime">${a.time}</div><div class="bname">${a.name}</div><div class="bmeta">${a.venue||'Venue not set'}</div>${a.notes&&a.notes.trim()?`<div class="bnote">${escapeHtml(a.notes.trim())}</div>`:''}</div><span class="bdots" title="More actions">⋮</span></div><span class="status ${a.status}">${statusLabel(a.status)}</span><div class="progressbar"><span style="width:${p}%"></span></div><div class="proglabel"><span>${done} of ${a.tasks.length} ready</span><span>${p}%</span></div><div class="minitasks">${a.tasks.slice(0,4).map(t=>`<div class="minitask ${t[1]?'done':''}"><span class="ck">${t[1]?'✓':''}</span>${t[0]}</div>`).join('')}</div>`;

     card.querySelector('.bdots').addEventListener('click',e=>{
       e.stopPropagation();
       showBookingMenu(e,a.id);
     });
     card.addEventListener('dragstart',e=>{
       draggedBooking=a.id;
       selected=a.id;
       card.classList.add('dragging');
       e.dataTransfer.effectAllowed='move';
       try{e.dataTransfer.setData('text/plain',String(a.id));}catch(_){}
       hideBookingMenu();
     });
     card.addEventListener('dragend',()=>{
       card.classList.remove('dragging');
       document.querySelectorAll('.bookday').forEach(x=>x.classList.remove('drop-target'));
       document.querySelectorAll('.booking').forEach(x=>x.classList.remove('drop-before'));
       draggedBooking=null;
     });
     card.addEventListener('dragover',e=>{
       if(draggedBooking==null||draggedBooking===a.id)return;
       e.preventDefault(); e.stopPropagation();
       document.querySelectorAll('.booking').forEach(x=>x.classList.remove('drop-before'));
       card.classList.add('drop-before');
     });
     card.addEventListener('drop',e=>{
       if(draggedBooking==null||draggedBooking===a.id)return;
       e.preventDefault(); e.stopPropagation();
       moveBookingToDay(draggedBooking,di,a.id);
       draggedBooking=null;
       suppressBookingClick=true;
       setTimeout(()=>suppressBookingClick=false,80);
       render(); loadDetail();
     });
     card.onclick=()=>{
       if(suppressBookingClick)return;
       selected=a.id;render();loadDetail();
     };
     list.appendChild(card);
   });
   board.appendChild(col);
 });
 updateSummary();
}

function moveBookingToDay(id,day,beforeId=null){
 const fromIndex=bookings.findIndex(x=>x.id===id); if(fromIndex<0)return;
 const item=bookings[fromIndex];
 bookings.splice(fromIndex,1);
 item.day=day;
 if(beforeId!=null){
   const idx=bookings.findIndex(x=>x.id===beforeId);
   if(idx>=0)bookings.splice(idx,0,item);else bookings.push(item);
 }else{
   let insert=bookings.length;
   for(let i=0;i<bookings.length;i++){if(bookings[i].day>day){insert=i;break;}}
   bookings.splice(insert,0,item);
 }
 selected=id;
 toast(`Moved “${item.name}” to ${DAYS[day][0]}`);
}


const BICON={
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 dup:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 move:'<path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>',
 task:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
 copy:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
 ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
 trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h11l-1 4 1 4H5"/>'
};
function menuButton(action,icon,label,cls=''){return `<button data-act="${action}" class="${cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>${label}</button>`}
function hideBookingMenu(){const m=document.getElementById('bookingMenu');if(m)m.style.display='none'}
function showBookingMenu(e,id){
 const a=bookings.find(x=>x.id===id);if(!a)return;
 selected=id;
 const m=document.getElementById('bookingMenu');
 m.dataset.id=id;
 let moves=DAYS.map((d,i)=>i===a.day?'':menuButton('move-'+i,BICON.move,'Move to '+d[0])).join('');
 m.innerHTML=
   menuButton('edit',BICON.edit,'Edit booking details')+
   menuButton('dup',BICON.dup,'Duplicate booking')+
   '<div class="sep"></div><div class="menu-label">Move</div>'+moves+
   '<div class="sep"></div><div class="menu-label">Status</div>'+
   menuButton('need',BICON.flag,'Mark Needs Booking')+
   menuButton('progress',BICON.flag,'Mark In Progress')+
   menuButton('confirmed',BICON.task,'Mark Confirmed')+
   '<div class="sep"></div>'+
   menuButton('addtask',BICON.task,'Add prep item')+
   menuButton('nextweek',BICON.copy,'Copy to next week')+
   menuButton('print',BICON.print,'Print booking sheet')+
   menuButton('cancel',BICON.ban,'Cancel booking')+
   '<div class="sep"></div>'+
   menuButton('delete',BICON.trash,'Delete booking','del');
 m.style.left=Math.min(e.clientX,innerWidth-260)+'px';
 m.style.top=Math.min(e.clientY,innerHeight-520)+'px';
 m.style.display='block';
}
document.getElementById('bookingMenu').addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn)return;
 e.stopPropagation();
 const id=+document.getElementById('bookingMenu').dataset.id;
 const a=bookings.find(x=>x.id===id);if(!a){hideBookingMenu();return}
 const act=btn.dataset.act;
 if(act==='edit'){
   selected=id;render();loadDetail();document.getElementById('detailCard').scrollIntoView({behavior:'smooth',block:'nearest'});fActivity.focus();
 }else if(act==='dup'){
   const nid=Math.max(0,...bookings.map(x=>x.id))+1;
   const copy=JSON.parse(JSON.stringify(a));copy.id=nid;copy.name=a.name+' (copy)';copy.status='need';copy.confirm='';
   bookings.splice(bookings.indexOf(a)+1,0,copy);selected=nid;render();loadDetail();toast('Booking duplicated');
 }else if(act.startsWith('move-')){
   moveBookingToDay(id,+act.split('-')[1]);render();loadDetail();
 }else if(['need','progress','confirmed'].includes(act)){
   a.status=act;render();loadDetail();toast('Status updated');
 }else if(act==='addtask'){
   selected=id;render();loadDetail();newTask.focus();toast('Add a prep item');
 }else if(act==='nextweek'){
   toast('Copied “'+a.name+'” to next week');
 }else if(act==='print'){
   toast('Printing booking sheet…');
 }else if(act==='cancel'){
   a.status='need';a.notes=(a.notes+'\nBooking cancelled / needs review.').trim();render();loadDetail();toast('Booking cancelled');
 }else if(act==='delete'){
   const i=bookings.findIndex(x=>x.id===id);
   if(i>=0){const nm=bookings[i].name;bookings.splice(i,1);selected=bookings[0]?.id||0;render();loadDetail();toast('Deleted “'+nm+'”')}
 }
 hideBookingMenu();
});
document.addEventListener('click',e=>{if(!e.target.closest('#bookingMenu')&&!e.target.closest('.bdots'))hideBookingMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideBookingMenu()});

function updateSummary(){const n=bookings.filter(a=>a.status==='need').length,p=bookings.filter(a=>a.status==='progress').length,c=bookings.filter(a=>a.status==='confirmed').length,t=bookings.reduce((s,a)=>s+a.tasks.filter(x=>!x[1]).length,0);sumNeeds.textContent=n;sumProgress.textContent=p;sumConfirmed.textContent=c;sumTasks.textContent=t;}
function loadDetail(){const a=bookings.find(x=>x.id===selected);if(!a)return;const tr=parseRange(a.time);fActivity.value=a.name;fService.value=a.service;fDay.value=String(a.day);fStartTime.value=tr[0];fEndTime.value=tr[1];fStatus.value=a.status;fDue.value=a.due;fVenue.value=a.venue;fContact.value=a.contact;fCost.value=a.cost;fConfirm.value=a.confirm;fNotes.value=a.notes;updateDetailSummary();detailChecklist.innerHTML=a.tasks.map((t,i)=>{const tc=String(t[2]||'Booking').toLowerCase().replace(/[^a-z0-9]+/g,'-');return `<label class="checkrow"><input type="checkbox" data-i="${i}" ${t[1]?'checked':''}><span>${t[0]}</span><span class="ctag ${tc}">${t[2]}</span></label>`}).join('');detailChecklist.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{a.tasks[+cb.dataset.i][1]=cb.checked?1:0;render();loadDetail()});quickAttach.innerHTML=bookings.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${DAYS[x.day][0]} · ${x.name}</option>`).join('');}
function saveDetail(){const a=bookings.find(x=>x.id===selected);if(!a)return;a.name=fActivity.value;a.service=fService.value;a.day=+fDay.value;a.time=makeRange(fStartTime.value,fEndTime.value);a.status=fStatus.value;a.due=fDue.value;a.venue=fVenue.value;a.contact=fContact.value;a.cost=fCost.value;a.confirm=fConfirm.value;a.notes=fNotes.value;render();loadDetail();toast('Saved “'+a.name+'”')}


['fService','fDay','fStartTime','fEndTime'].forEach(id=>{
  const el=document.getElementById(id);
  if(el)el.addEventListener('change',updateDetailSummary);
});

saveBtn.onclick=saveDetail;
resetBtn.onclick=loadDetail;
addTask.onclick=()=>{const a=bookings.find(x=>x.id===selected),v=newTask.value.trim();if(!a||!v)return;a.tasks.push([v,0,'Booking']);newTask.value='';render();loadDetail();toast('Prep item added')};
quickAdd.onclick=()=>{const v=quickText.value.trim();if(!v)return;const a=bookings.find(x=>x.id===+quickAttach.value);if(!a)return;a.tasks.push([v,0,'Booking']);const row=document.createElement('div');row.className='bd';row.innerHTML=`<span class="bdot"></span><span>${v.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))} <span class="cat">· ${a.name}</span></span>`;brainList.prepend(row);quickText.value='';render();if(a.id===selected)loadDetail();toast('Added to '+a.name)};
cancelBooking.onclick=()=>{const a=bookings.find(x=>x.id===selected);if(!a)return;a.status='need';a.notes=(a.notes+'\nBooking cancelled / needs review.').trim();render();loadDetail();toast('Booking marked for attention')};
addBooking.onclick=()=>{const id=Math.max(...bookings.map(x=>x.id))+1;bookings.push({id,day:0,time:'1:00–2:00',name:'New Activity',service:'Day Hab',status:'need',venue:'',contact:'',cost:'',due:'',confirm:'',notes:'',tasks:[['Contact venue',0,'Booking']]});selected=id;filter='all';document.querySelectorAll('.vf').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));render();loadDetail();fActivity.focus();toast('New booking added')};
document.querySelectorAll('.vf').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.vf').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');const k=t.dataset.tab;filter=k==='week'||k==='completed'?'all':k;document.querySelectorAll('.vf').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));render();if(k==='completed')toast('Completed history view is ready for archived bookings')});
prevWeek.onclick=()=>toast('Previous week');nextWeek.onclick=()=>toast('Next week');btnThisWeek.onclick=()=>toast('Showing current week');
(function(){function tick(){var n=new Date();clkD.textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});clkT.textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}tick();setInterval(tick,15000)})();
render();loadDetail();
</script>
