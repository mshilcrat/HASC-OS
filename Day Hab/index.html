:root{
  --ui:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  --canvas:#f1efe9; --paper:#ffffff;
  --ink:#233038; --ink2:#3a4a54; --muted:#6a7a84; --faint:#9fb0b8;
  --line:#e7e2d9; --line2:#eef1f4;

  --teal:#17a2b8; --teal-ink:#0f7d8f; --teal-wash:#e8f6f8;

  --dayhab:#568E62; --dayhab-ink:#39684a; --dayhab-wash:#eef4ef;
  --prevoc:#3E9EB3; --prevoc-ink:#2f7d90; --prevoc-wash:#e9f4f6;
  --supp:#AC659D;   --supp-ink:#7c4470;   --supp-wash:#f6eff4;

  --gold:#D9B93B; --gold-ink:#8a7415; --gold-wash:#fbf6e4;
  --coral:#C96A44; --coral-ink:#9a4a2b; --coral-wash:#f9ede7;
  --slate:#5b7a99; --slate-ink:#3f5a75; --slate-wash:#eef2f6;
  --indigo:#6E63B0; --indigo-ink:#4a4290; --indigo-wash:#efeef8;
  --red:#D96A54;

  --purple:#17a2b8; --purple2:#38b6cb;
  --yellow:#D9B93B; --orange:#C96A44;

body{font-family:var(--ui);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h1,h2,h3,h4,h5{margin:0}
button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.side{background:var(--paper);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 4px 16px;border-bottom:1px solid var(--line)}
.side .brand img{height:44px;width:auto;max-width:100%;flex:none;align-self:center;display:block}
.side .brand .dept{font-size:10px;font-weight:800;letter-spacing:2.6px;color:var(--purple);text-transform:uppercase}

.nav{display:flex;flex-direction:column;gap:3px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;text-decoration:none;transition:background .15s,color .15s}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--canvas);color:var(--ink)}
.nav a.on{background:var(--supp-wash);color:var(--supp-ink);font-weight:700}
.nav a.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--purple)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px}
.card h4{font-size:10.5px;letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;font-weight:800;margin-bottom:11px}
.qa{display:flex;flex-direction:column;gap:2px}
.qa button{display:flex;align-items:center;gap:11px;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--ink);font-weight:600;font-size:13.5px;text-align:left;transition:background .15s}
.qa button:hover{background:var(--canvas)}
.qa button .p{width:20px;height:20px;border-radius:6px;background:var(--supp-wash);color:var(--purple);display:grid;place-items:center;flex:none}
.qa button .p svg{width:12px;height:12px;display:block}
.weekof .row{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13.5px}
.weekof .row .chev{color:var(--faint);font-size:18px}
.weekof .today{margin-top:11px;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px;font-weight:700;font-size:13px;color:var(--ink);transition:.15s}
.weekof .today:hover{border-color:var(--purple);color:var(--purple);background:var(--supp-wash)}
.footlogo{margin-top:auto;padding-top:6px}
.footlogo img{height:20px;width:auto;max-width:100%;opacity:.55}

/* ---------- MAIN ---------- */
.main{padding:24px;display:flex;flex-direction:column;gap:22px;min-width:0}
.rowgrid{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:22px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}

.phead{display:flex;align-items:center;gap:10px;padding:19px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.phead .titles h2{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.3px;color:var(--ink)}
.phead .titles p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.phead .spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:13px;padding:9px 14px;border-radius:11px;transition:transform .12s,box-shadow .12s,border-color .12s,background .12s}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn:hover{border-color:#cfd8dc;box-shadow:var(--sh-xs);transform:translateY(-1px)}
.btn.on{background:var(--supp-wash);border-color:#dcd7f1;color:var(--supp-ink);font-weight:700}
.btn.primary{background:linear-gradient(135deg,var(--purple2),var(--purple));border:0;color:#fff;font-weight:700;box-shadow:0 6px 16px -5px rgba(90,81,164,.55)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 9px 22px -6px rgba(90,81,164,.6)}
.gear{width:37px;height:37px;border:1px solid var(--line);background:#fff;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.gear svg{width:17px;height:17px;stroke-width:2}
.gear:hover{border-color:var(--purple);color:var(--purple)}

/* ---------- WEEK GRID ---------- */
.week{display:grid;grid-template-columns:132px repeat(5,minmax(0,1fr))}
.week .corner{border-bottom:1px solid var(--line)}
.dhead{position:relative;text-align:center;padding:14px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);cursor:pointer;transition:background .15s}
.dhead:hover{background:var(--canvas)}
.dhead .dow{font-size:11.5px;font-weight:800;letter-spacing:.5px;color:var(--muted)}
.dhead .date{font-size:11.5px;color:var(--faint);margin-top:3px}
.dhead.sel .dow{color:var(--ink)}
.dhead.sel::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:7px;width:22px;height:3px;border-radius:2px;background:var(--yellow)}

.plabel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 8px;border-bottom:1px solid var(--line)}
.plabel .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;box-shadow:var(--sh-xs)}
.plabel .ic svg{width:18px;height:18px;stroke:#fff;stroke-width:2.2}
.plabel .lb{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-align:center;line-height:1.25}
.plabel.dayhab{background:var(--dayhab-wash)} .plabel.dayhab .ic{background:linear-gradient(135deg,#4fa771,var(--dayhab))} .plabel.dayhab .lb{color:var(--dayhab-ink)}
.plabel.prevoc{background:var(--prevoc-wash)} .plabel.prevoc .ic{background:linear-gradient(135deg,#3cbccb,var(--prevoc))} .plabel.prevoc .lb{color:var(--prevoc-ink)}
.plabel.supp{background:var(--supp-wash)} .plabel.supp .ic{background:linear-gradient(135deg,#7b72c4,var(--supp))} .plabel.supp .lb{color:var(--supp-ink)}

.wcell{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px;display:flex;flex-direction:column;gap:8px;min-height:98px}
.chip{position:relative;border:1px solid var(--line);border-left:3px solid;border-radius:10px;padding:9px 11px;background:#fff;box-shadow:var(--sh-xs);transition:transform .12s,box-shadow .12s;cursor:default}
.chip:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.chip .t{font-weight:700;font-size:12.5px;line-height:1.2}
.chip .h{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:500}
.chip.dayhab{border-left-color:var(--dayhab);background:var(--dayhab-wash)} .chip.dayhab .t{color:var(--dayhab-ink)}
.chip.prevoc{border-left-color:var(--prevoc);background:var(--prevoc-wash)} .chip.prevoc .t{color:var(--prevoc-ink)}
.chip.supp{border-left-color:var(--supp);background:var(--supp-wash)} .chip.supp .t{color:var(--supp-ink)}
.flag{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;font-weight:800;color:#9a6a12;background:#fff6df;border:1px solid var(--warm-line);border-radius:8px;padding:4px 8px}
.flag svg{width:11px;height:11px;stroke-width:2.2}

/* list view */
.list{padding:6px}
.list .li{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;transition:background .15s}
.list .li:hover{background:var(--canvas)}
.list .pill{font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:5px 9px;border-radius:20px;color:#fff;flex:none}
.list .pill.dayhab{background:var(--dayhab)}.list .pill.prevoc{background:var(--prevoc)}.list .pill.supp{background:var(--supp)}
.list .nm{font-weight:700;font-size:13.5px}
.list .mt{font-size:12px;color:var(--muted);margin-top:1px}
.list .wd{margin-left:auto;font-size:12px;color:var(--faint);font-weight:700}

/* ---------- RIGHT RAIL ---------- */
.rail{display:flex;flex-direction:column;gap:18px}
.railcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px}
.railcard .rh{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:14px;font-weight:800;letter-spacing:-.2px;color:var(--ink);margin-bottom:14px}
.railcard .rh svg{width:18px;height:18px}
.railcard h5{font-size:11px;color:var(--muted);margin:15px 0 7px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.railcard h5:first-of-type{margin-top:0}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.rlist li{font-size:13px;color:var(--ink);display:flex;gap:9px;line-height:1.35;align-items:baseline}
.rlist li .dot{width:6px;height:6px;border-radius:50%;background:var(--purple);flex:none;translate:0 4px}
.rlist li .when{color:var(--faint);font-weight:500}
.railbtn{margin-top:15px;width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;font-weight:700;font-size:13px;color:var(--ink);transition:.15s}
.railbtn:hover{border-color:var(--purple);color:var(--purple);background:var(--supp-wash)}

.staffrow{display:flex;align-items:center;gap:11px;padding:6px 0}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none;box-shadow:var(--sh-xs)}
.avatar.dayhab{background:linear-gradient(135deg,#4fa771,var(--dayhab))}
.avatar.prevoc{background:linear-gradient(135deg,#3cbccb,var(--prevoc))}
.avatar.supp{background:linear-gradient(135deg,#7b72c4,var(--supp))}
.staffrow .nm{font-weight:700;font-size:13.5px}
.staffrow .as{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500}
.trow{display:flex;gap:13px;font-size:13px;padding:5px 0;align-items:baseline}
.trow .tm{color:var(--purple);font-weight:800;min-width:42px}
.rail .print{margin-top:2px;width:100%;justify-content:center;padding:11px}

/* ---------- DAY PLANNER ---------- */
.dtop{display:flex;align-items:center;gap:10px;padding:19px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dtop .cal{display:inline-flex;align-items:baseline;gap:10px}
.dtop .cal .ci{align-self:center;color:var(--purple);display:flex}
.dtop .cal .ci svg{width:17px;height:17px;stroke-width:2}
.dtop .cal .dow{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.2px}
.dtop .cal .fd{color:var(--muted);font-size:14px;font-weight:500}
.cheads{display:grid;grid-template-columns:116px repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cheads .th{text-align:center;font-size:11px;font-weight:800;letter-spacing:.6px;padding:12px;border-left:1px solid var(--line)}
.cheads .th.dayhab{background:var(--dayhab-wash);color:var(--dayhab-ink)}
.cheads .th.prevoc{background:var(--prevoc-wash);color:var(--prevoc-ink)}
.cheads .th.supp{background:var(--supp-wash);color:var(--supp-ink)}
.cheads .th.blank{background:var(--time-col);color:var(--faint);font-size:10px;letter-spacing:1.4px}
.dbody{display:grid;grid-template-columns:116px repeat(3,minmax(0,1fr))}
.slot{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px;min-height:70px;display:flex;flex-direction:column;gap:8px}
.tg{background:var(--time-col);border-bottom:1px solid var(--line);padding:13px 8px 0;text-align:center;font-size:11px;color:var(--muted);font-weight:700;line-height:1.3}
.band{grid-column:2 / -1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--warm-band);color:var(--warm-ink);font-weight:700;font-size:13px}
.band .tt{display:flex;align-items:center;gap:8px}
.band .tt svg{width:15px;height:15px;stroke-width:2}
.band .sub{font-weight:600;color:#a98a3e;font-size:12px}
.acard{position:relative;border:1px solid var(--line);border-left:4px solid;border-radius:12px;padding:11px 12px;box-shadow:var(--sh-xs);transition:transform .12s,box-shadow .12s}
.acard:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.acard.dayhab{border-left-color:var(--dayhab);background:var(--dayhab-wash)}.acard.dayhab .name{color:var(--dayhab-ink)}
.acard.prevoc{border-left-color:var(--prevoc);background:var(--prevoc-wash)}.acard.prevoc .name{color:var(--prevoc-ink)}
.acard.supp{border-left-color:var(--supp);background:var(--supp-wash)}.acard.supp .name{color:var(--supp-ink)}
.acard .name{font-weight:800;font-size:13px;letter-spacing:-.1px}
.acard .kv{display:flex;gap:7px;font-size:11.5px;margin-top:5px;line-height:1.35}
.acard .kv .k{color:var(--muted);font-weight:600;min-width:62px}
.acard .kv .v{color:var(--ink)}
.acard .dots{position:absolute;top:9px;right:10px;color:var(--faint);font-weight:900;letter-spacing:1px;font-size:13px;cursor:pointer}

.stub{padding:64px 24px;text-align:center;color:var(--muted)}
.stub .si{width:52px;height:52px;border-radius:16px;background:var(--supp-wash);color:var(--purple);display:grid;place-items:center;margin:0 auto 14px}
.stub .si svg{width:24px;height:24px;stroke-width:2}
.stub h2{font-family:var(--display);font-size:19px;margin-bottom:6px;color:var(--ink)}
.stub p{max-width:340px;margin:0 auto;font-size:13.5px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,30,36,.44);backdrop-filter:blur(2px);display:none;place-items:center;z-index:60;padding:20px}
.scrim.open{display:grid}
.modal{width:min(470px,100%);background:#fff;border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.3);overflow:hidden}
.modal h3{font-family:var(--display);padding:20px 22px;border-bottom:1px solid var(--line);font-size:17px}
.modal .mb{padding:20px 22px;display:grid;gap:13px}
.modal label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.2px;display:block;margin-bottom:6px}
.modal input,.modal select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
.modal input:focus,.modal select:focus{outline:2px solid var(--purple);outline-offset:-1px;border-color:var(--purple)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.modal .mf{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:70;box-shadow:var(--sh-lift)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1120px){.rowgrid{grid-template-columns:1fr}}
@media (max-width:880px){.app{grid-template-columns:1fr}.side{position:static;height:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.chip:hover,.acard:hover,.btn:hover{transform:none}}

/* ===================================================================
   HASC OS PARITY LAYER  ---  warm chrome, teal primary, OS palette
   =================================================================== */
:root{--topbar:65px}
.os{min-height:100vh}

/* top strip (ported from HASC OS) */
.topbar{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 34px;position:sticky;top:0;z-index:10}
.topbar .logo{display:flex;align-items:center}
.topbar .logo img{height:36px;width:auto;display:block}
.topbar .rule{width:1px;height:26px;background:var(--line)}
.topbar .brandlabel{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--paper);color:var(--muted);display:grid;place-items:center;transition:border-color .15s,color .15s}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{border-color:var(--teal);color:var(--teal)}
.iconbtn .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.clock{text-align:right;line-height:1.25}
.clock .d{font-size:12.5px;font-weight:700;color:var(--ink2)}
.clock .t{font-size:12px;color:var(--faint);font-weight:600}
.me{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--line)}
.me .badge{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;background:var(--teal)}
.me .nm{font-size:14px;font-weight:700;line-height:1.2}
.me .rl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.me .out{margin-left:2px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--paper);transition:border-color .15s,color .15s}
.me .out svg{width:16px;height:16px}
.me .out:hover{border-color:var(--teal);color:var(--teal)}

/* sit sidebar beneath the sticky topbar */
.app{min-height:calc(100vh - var(--topbar))}
.side{top:var(--topbar);height:calc(100vh - var(--topbar))}

/* sidebar brand: dept eyebrow + app title (logo now lives in the topbar) */
.side .brand{align-items:flex-start;gap:4px;padding:2px 6px 16px}
.side .brand .dept{font-size:10px;font-weight:800;letter-spacing:2.4px;color:var(--teal);text-transform:uppercase}
.side .brand .deptsub{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}

/* re-point primary-tinted chrome from the old purple/indigo to OS teal */
.nav a.on{background:var(--teal-wash);color:var(--teal-ink)}
.nav a.on::before{background:var(--teal)}
.qa button .p{background:var(--teal-wash);color:var(--teal)}
.btn.on{background:var(--teal-wash);border-color:#cfe9ee;color:var(--teal-ink)}
.weekof .today:hover{background:var(--teal-wash);border-color:var(--teal);color:var(--teal)}
.railbtn:hover{background:var(--teal-wash);border-color:var(--teal);color:var(--teal)}
.gear:hover{border-color:var(--teal);color:var(--teal)}
.stub .si{background:var(--teal-wash);color:var(--teal)}
.rlist li .dot{background:var(--teal)}
.trow .tm{color:var(--teal)}
.dhead.sel::after{background:var(--gold)}

/* primary button -> teal gradient with a matching warm-teal shadow */
.btn.primary{background:linear-gradient(135deg,var(--purple2),var(--purple));box-shadow:0 6px 16px -5px rgba(23,162,184,.5)}
.btn.primary:hover{box-shadow:0 9px 22px -6px rgba(23,162,184,.58)}

/* program plates & avatars re-tuned to the OS green / blue / plum hues */
.plabel.dayhab .ic,.avatar.dayhab{background:linear-gradient(135deg,#6fae7c,var(--dayhab))}
.plabel.prevoc .ic,.avatar.prevoc{background:linear-gradient(135deg,#5cb6c9,var(--prevoc))}
.plabel.supp .ic,.avatar.supp{background:linear-gradient(135deg,#c483b7,var(--supp))}

/* needs-booking flag -> warm gold */
.flag{color:var(--gold-ink);background:var(--gold-wash);border-color:var(--warm-line)}
.band .sub{color:#a98a3e}

/* responsive: fold topbar meta on small screens */
@media (max-width:980px){.topbar .clock{display:none}}
@media (max-width:880px){
  .side{position:static;height:auto}
  .topbar{padding:12px 16px;gap:12px}
  .me .nm,.me .rl{display:none}
}
@media (max-width:560px){.topbar .brandlabel{display:none}}

/* ===================================================================
   DASHBOARD HOME  ---  OS-style launcher: hero centerpiece + app tiles + rails
   =================================================================== */
.home{max-width:1180px;margin:0 auto}
.hello{display:flex;align-items:flex-end;gap:11px;margin:2px 0 0}
.hello h1{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0;color:var(--ink)}
.hello .wave{font-size:23px;line-height:1}
.hellosub{color:var(--muted);font-size:14.5px;margin:6px 0 24px}
.hellosub b{color:var(--ink2);font-weight:700}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:22px;align-items:start}
@media (max-width:1120px){.hgrid{grid-template-columns:1fr}}

/* hero featured card (mirrors the HASC OS residence card) */
.hero{display:grid;grid-template-columns:274px 1fr;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);margin-bottom:26px}
.hero .heroside{position:relative;background:linear-gradient(160deg,#38b6cb,#0f7d8f);color:#fff;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;min-height:200px}
.hero .heroside .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.92}
.hero .heroside .k svg{width:16px;height:16px}
.hero .heroside .big{font-size:48px;font-weight:800;line-height:.9;letter-spacing:-.03em}
.hero .heroside .biglabel{font-size:13px;font-weight:700;opacity:.92;margin-top:7px}
.hero .heroside .meta{font-size:12.5px;opacity:.9;font-weight:600;line-height:1.65}
.hero .herobody{padding:22px 24px;display:flex;flex-direction:column}
.hero .ey{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.hero .ey svg{width:15px;height:15px}
.hero h2{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 13px;color:var(--ink)}
.hero .hl{display:flex;gap:10px;font-size:13.5px;color:var(--ink2);margin-bottom:9px;align-items:baseline;line-height:1.4}
.hero .hl .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none;translate:0 5px}
.hero .hl b{color:var(--ink);font-weight:800}
.hero .cta{margin-top:auto;display:inline-flex;align-items:center;justify-content:space-between;gap:12px;background:var(--teal);color:#fff;font-weight:800;font-size:14px;padding:13px 20px;border-radius:12px;border:0;width:100%;transition:background .15s}
.hero .cta svg{width:18px;height:18px}
.hero .cta:hover{background:var(--teal-ink)}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .heroside{min-height:150px}}

/* section header (mirrors OS ".sec") */
.sec{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 15px;display:flex;align-items:center;gap:12px}
.sec .ln{flex:1;height:1px;background:var(--line)}

/* app / module tiles (mirrors OS ".mtiles"/".mtile") */
.mtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:1120px){.mtiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.mtiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.mtiles{grid-template-columns:1fr}}
.mtile{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:19px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;box-shadow:var(--sh-xs);text-align:left;font-family:inherit}
.mtile:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:transparent}
.mtile .plate{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:13px}
.mtile .plate svg{width:23px;height:23px;stroke-width:2}
.mtile h3{font-family:var(--display);font-size:16px;font-weight:800;letter-spacing:-.01em;margin:0 0 5px;color:var(--ink)}
.mtile p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;flex:1}
.mtile .stat{margin-top:13px;align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.2px;padding:4px 10px;border-radius:999px}
.mtile .go{position:absolute;top:19px;right:19px;color:var(--faint);opacity:0;transition:opacity .15s,transform .15s}
.mtile:hover .go{opacity:1;transform:translateX(2px)}
.mtile .go svg{width:17px;height:17px;stroke-width:2.4}

/* rail "at a glance" stat grid (mirrors OS ".glance") */
.glance{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcell{text-align:center;border-radius:13px;padding:14px 6px}
.gcell .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin:0 auto 8px}
.gcell .gi svg{width:19px;height:19px;stroke-width:2}
.gcell .gn{font-size:23px;font-weight:800;line-height:1;color:var(--ink)}
.gcell .gl{font-size:11px;font-weight:700;color:var(--muted);margin-top:5px;line-height:1.25}

/* ===================================================================
   DAY HAB  ---  topbar + centered shell (no sidebar), weather hero, notes app
   =================================================================== */
.topbar .logo,.topbar .brandlabel{cursor:pointer}
.app{display:block;min-height:calc(100vh - var(--topbar))}
.main{max-width:1240px;margin:0 auto;padding:28px 32px 64px;gap:16px}
.home{max-width:none;margin:0}
@media (max-width:680px){.main{padding:20px 16px 44px}}

/* back-to-dashboard breadcrumb on module views */
.crumb{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--muted);font-weight:700;font-size:13px;padding:0 2px 2px;cursor:pointer;transition:color .15s;align-self:flex-start}
.crumb svg{width:16px;height:16px}
.crumb:hover{color:var(--teal)}

/* hero weather panel (mirrors the HASC OS residence weather card) */
.hero .wx{position:relative;background:linear-gradient(160deg,#3fb7cc,#0f7d8f);color:#fff;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;min-height:206px}
.hero .wx .wxtop{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.94}
.hero .wx .wxtop svg{width:16px;height:16px}
.hero .wx .wxmid{display:flex;align-items:flex-start;gap:5px}
.hero .wx .wxtemp{font-size:52px;font-weight:800;line-height:.85;letter-spacing:-.03em}
.hero .wx .wxdeg{font-size:18px;font-weight:800;margin-top:5px;opacity:.9}
.hero .wx .wxcond{font-size:15px;font-weight:700;margin-top:7px;opacity:.96}
.hero .wx .wxmeta{font-size:12.5px;opacity:.92;font-weight:600;line-height:1.5}

/* hero body meta */
.hero .chip{align-self:flex-start;font-size:12px;font-weight:800;color:var(--dayhab-ink);background:var(--dayhab-wash);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.hero .hmeta{font-size:13px;color:var(--ink2);margin-bottom:8px}
.hero .hmeta b{color:var(--muted);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:8px}

/* Notes app */
.notespanel{max-width:760px}
.notesbody{padding:20px 22px}
.qarow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.qabtn{display:inline-flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;color:var(--ink);transition:border-color .15s,color .15s,background .15s}
.qabtn .p{width:24px;height:24px;border-radius:7px;background:var(--teal-wash);color:var(--teal);display:grid;place-items:center}
.qabtn .p svg{width:13px;height:13px;stroke-width:2.6}
.qabtn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-wash)}
.notesh{font-size:11px;color:var(--muted);margin:0 0 6px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.notelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.notelist li{display:flex;gap:11px;align-items:baseline;padding:12px 2px;border-top:1px solid var(--line2);font-size:14px;color:var(--ink);line-height:1.4}
.notelist li:first-child{border-top:0}
.notelist li .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none;translate:0 5px}

.me .badge{background:var(--rolec,var(--teal))}
.me #meName{white-space:nowrap}

/* ===================================================================
   NEEDS-YOU ACTION FEED  ---  dashboard centerpiece (namespaced .nf-*)
   Surfaces overdue / due-soon / needs-planning / closures automatically.
   =================================================================== */
.deptrow{display:flex;justify-content:flex-end;margin-bottom:14px}
.deptrow select{font:600 12.5px var(--ui);color:#333;background:#fff;border:1px solid #d9d9d9;border-radius:9px;padding:6px 8px;min-width:190px;max-width:220px}
.nf-hmeta{font-size:12.5px;color:var(--muted);margin:-14px 0 22px}
.nf-hmeta b{color:var(--ink2);font-weight:800;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;margin-right:8px}
.nf{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);margin-bottom:26px}
.nf-top{display:flex;align-items:center;justify-content:space-between;padding:19px 22px 14px;flex-wrap:wrap;gap:10px}
.nf-title{display:flex;align-items:center;gap:11px}
.nf-glyph{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,#3a4a54,#233038);color:#fff;display:grid;place-items:center}
.nf-glyph svg{width:18px;height:18px}
.nf-title h2{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.2px;color:var(--ink)}
.nf-title p{font-size:12.5px;color:var(--muted);margin-top:2px}
.nf-tally{display:flex;gap:7px}
.nf-tally span{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line)}
.nf-tally .red{color:var(--red);background:#fbeeeb;border-color:#f2d9d2}
.nf-tally .amber{color:var(--gold-ink);background:var(--gold-wash);border-color:var(--warm-line)}
.nf-group{padding:2px 12px 6px}
.nf-gh{display:flex;align-items:center;gap:8px;padding:12px 12px 6px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.nf-gh .n{margin-left:auto;font-weight:700;letter-spacing:0;color:var(--faint);text-transform:none;font-size:12px}
.nf-dot{width:8px;height:8px;border-radius:50%}
.nf-group.over .nf-gh{color:var(--red)} .nf-group.over .nf-dot{background:var(--red)}
.nf-group.soon .nf-gh{color:var(--gold-ink)} .nf-group.soon .nf-dot{background:var(--gold)}
.nf-group.plan .nf-gh{color:var(--dayhab-ink)} .nf-group.plan .nf-dot{background:var(--dayhab)}
.nf-group.clos .nf-gh{color:var(--supp-ink)} .nf-group.clos .nf-dot{background:var(--supp)}
.nf-row{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:13px;cursor:pointer;transition:background .13s;position:relative}
.nf-row:hover{background:var(--canvas)}
.nf-row .spine{position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px}
.nf-row.r-over .spine{background:var(--red)} .nf-row.r-soon .spine{background:var(--gold)}
.nf-tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.nf-tile svg{width:18px;height:18px;stroke:#fff;stroke-width:1.9}
.nf-tile.dayhab{background:linear-gradient(135deg,#6fae7c,var(--dayhab))}
.nf-tile.prevoc{background:linear-gradient(135deg,#5cb6c9,var(--prevoc))}
.nf-tile.supp{background:linear-gradient(135deg,#c483b7,var(--supp))}
.nf-tile.neu{background:linear-gradient(135deg,#c8c0b4,#a79e90)}
.nf-body{flex:1;min-width:0}
.nf-tt{font-size:14.5px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.nf-mt{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.nf-mt .pip{width:3px;height:3px;border-radius:50%;background:#cfc7bb}
.nf-svc{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.nf-svc.dayhab{color:var(--dayhab-ink);background:var(--dayhab-wash)}
.nf-svc.prevoc{color:var(--prevoc-ink);background:var(--prevoc-wash)}
.nf-svc.supp{color:var(--supp-ink);background:var(--supp-wash)}
.nf-right{display:flex;align-items:center;gap:10px;flex:none}
.nf-due{font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap}
.nf-due.over{color:var(--red);background:#fbeeeb}
.nf-due.soon{color:var(--gold-ink);background:var(--gold-wash)}
.nf-due.up{color:var(--ink2);background:var(--canvas)}
.nf-av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.nf-tasks{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:700}
.nf-bar{width:44px;height:5px;border-radius:3px;background:#eae5dc;overflow:hidden}
.nf-bar i{display:block;height:100%;background:var(--dayhab);border-radius:3px}
.nf-chev{color:#c8c0b4;flex:none;display:flex}
.nf-chev svg{width:16px;height:16px}
.nf-status{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px}
.nf-status.closed{color:var(--red);background:#fbeeeb}
.nf-status.early{color:var(--gold-ink);background:var(--gold-wash)}
.nf-seed{padding:2px 14px 16px;font-size:11.5px;color:var(--faint);font-style:italic}
</style>
</head>

        ${rail}
      </div>
      <div class="sec">Program tools <span class="ln"></span></div>
      <div class="mtiles">${cards}</div>
    </div>`;
  }

  function weekPanel(){
    const head=`<div class="phead">
        <div class="titles"><h2>Weekly Overview</h2><p>Plan the week at a glance</p></div>
        <div class="spacer"></div>
        <button class="btn" data-toast="Copy Week duplicates this schedule into next week">${ic('grid')} Copy week</button>
        <button class="btn ${weekMode==='week'?'on':''}" data-wmode="week">${ic('grid')} Week</button>
        <button class="btn ${weekMode==='list'?'on':''}" data-wmode="list">${ic('cal')} List</button>
        <button class="gear" data-toast="Settings" aria-label="Settings">${ic('gear')}</button>
      </div>`;
    if(weekMode==='list'){
      const rows=[];
      DAYS.forEach((d,i)=>(A[i]||[]).slice().sort((a,b)=>toMin(a.start)-toMin(b.start)).forEach(a=>rows.push([i,a])));
      const body=`<div class="list">${rows.map(([i,a])=>`<div class="li">
        <span class="pill ${a.prog}">${a.prog==='dayhab'?'DAY HAB':a.prog==='prevoc'?'PREVOC':'SUPP'}</span>
        <div><div class="nm">${esc(a.name)}</div><div class="mt tnum">${esc(a.start)} – ${esc(a.end)} · ${esc(a.loc)}</div></div>
        <span class="wd">${DAYS[i].dow.slice(0,3)}</span></div>`).join("")}</div>`;
      return `<section class="panel">${head}${body}</section>`;
    }
    let g=`<div class="week"><div class="corner"></div>`;
    DAYS.forEach((d,i)=>g+=`<div class="dhead ${i===cur?'sel':''}" data-day="${i}"><div class="dow">${d.dow}</div><div class="date tnum">${d.date}</div></div>`);
    PROGS.forEach(p=>{
      g+=`<div class="plabel ${p.key}"><span class="ic">${ic(p.ic)}</span><span class="lb">${p.label}</span></div>`;
      DAYS.forEach((d,i)=>{
        const items=(A[i]||[]).filter(a=>a.prog===p.key).sort((a,b)=>toMin(a.start)-toMin(b.start));
        g+=`<div class="wcell">${items.map(a=>`<div class="chip ${p.key}"><div class="t">${esc(a.name)}</div><div class="h tnum">${esc(a.start)} – ${esc(a.end)}</div>${a.needsBooking?`<div class="flag">${ic('warn')} Needs booking</div>`:``}</div>`).join("")}</div>`;
      });
    });
    g+=`</div>`;
    return `<section class="panel">${head}${g}</section>`;
  }

  function dayPanel(){
    const grp={dayhab:[],prevoc:[],supp:[]}; (A[cur]||[]).forEach(a=>grp[a.prog].push(a));
    const card=(t)=>`<div class="acard ${t.prog}"><span class="dots">⋮</span><div class="name">${esc(t.name)}</div>
      <div class="kv"><span class="k">Individuals</span><span class="v">${esc(t.ind)}</span></div>
      <div class="kv"><span class="k">Staff</span><span class="v">${esc(t.staff)}</span></div>
      <div class="kv"><span class="k">Location</span><span class="v">${esc(t.loc)}</span></div></div>`;
    const ROWS=[
      {time:"9:00 – 10:00",band:{ic:"coffee",title:"Arrival, Breakfast, Morning Meeting",sub:"All programs together"}},
      {time:"10:00 – 11:00",lo:-1,hi:660},
      {time:"11:00 – 12:00",lo:660,hi:720},
      {time:"12:00 – 1:00",band:{ic:"utensils",title:"Lunch",sub:"All programs together"}},
      {time:"1:00 – 2:00",lo:720,hi:840},
      {time:"2:00 – 3:00",lo:840,hi:900},
      {time:"3:30 – 4:30",lo:900,hi:99999}
    ];
    let rows="";
    ROWS.forEach(r=>{
      rows+=`<div class="tg tnum">${r.time}</div>`;
      if(r.band){ rows+=`<div class="band"><span class="tt">${ic(r.band.ic)} ${r.band.title}</span><span class="sub">${r.band.sub}</span></div>`; return; }
      ["dayhab","prevoc","supp"].forEach(p=>{
        const cell=grp[p].filter(a=>{const m=toMin(a.start);return m>=r.lo&&m<r.hi;})
          .sort((a,b)=>toMin(a.start)-toMin(b.start)).map(card).join("");
        rows+=`<div class="slot">${cell}</div>`;
      });
    });
    const head=`<div class="dtop">
        <span class="cal"><span class="ci">${ic('cal')}</span><span class="dow">${DAYS[cur].dow}</span><span class="fd tnum">${DAYS[cur].full}</span></span>
        <div class="spacer" style="flex:1"></div>
        <button class="btn" data-toast="Use Template applies a saved daily layout">Use template</button>
        <button class="btn" data-toast="Copy Day duplicates today onto another day">Copy day</button>
        <button class="btn primary" data-add="activity">${ic('plus')} Add activity</button>
      </div>
      <div class="cheads"><div class="th blank">TIME</div><div class="th dayhab">DAY HAB</div><div class="th prevoc">PREVOC</div><div class="th supp">SUPPLEMENTAL</div></div>`;
    return `<section class="panel">${head}<div class="dbody">${rows}</div></section>`;
  }

  function stub(title){
    return `<section class="panel"><div class="stub"><div class="si">${ic('grid')}</div><h2>${esc(title)}</h2><p>Part of the prototype shell — ready to wire to the shared data layer.</p></div></section>`;
  }

  function notesHTML(){
    const qa=(k,l)=>`<button class="qabtn" data-add="${k}"><span class="p">${ic('plus')}</span> ${l}</button>`;
    const notes=DAYRAIL.notes.concat(["Order snacks for Friday’s outing","Confirm transport for the museum trip"]);
    return `<section class="panel notespanel">
      <div class="phead"><div class="titles"><h2>Notes</h2><p>Quick actions and program notes</p></div></div>
      <div class="notesbody">
        <div class="qarow">${qa('activity','Add Activity')}${qa('outing','Add Outing')}${qa('note','Add Note')}</div>
        <h5 class="notesh">Recent notes</h5>
        <ul class="notelist">${notes.map(n=>`<li><span class="dot"></span><span>${esc(n)}</span></li>`).join("")}</ul>
      </div>
    </section>`;
  }
  function hydrateHome(){
    var d=document.getElementById('wxDate');
    if(d) d.textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    loadWeather();
  }
  function wcodeMap(c){
    if(c===0)return'Clear';if(c<=2)return'Partly cloudy';if(c===3)return'Overcast';
    if(c<=48)return'Fog';if(c<=57)return'Drizzle';if(c<=67)return'Rain';
    if(c<=77)return'Snow';if(c<=82)return'Showers';if(c<=86)return'Snow showers';return'Thunderstorm';
  }
  async function loadWeather(){
    var t=document.getElementById('wxTemp'), c=document.getElementById('wxCond');
    if(!t)return;
    try{
      var r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.6229&longitude=-73.7248&current=temperature_2m,weather_code&temperature_unit=fahrenheit',{cache:'no-store'});
      var j=await r.json();
      t.textContent=Math.round(j.current.temperature_2m); c.textContent=wcodeMap(j.current.weather_code);
    }catch(e){ t.textContent='78'; c.textContent='Partly cloudy'; }
  }

  function render(){
    const main=document.getElementById("main");
    let body;
    if(view==="dashboard") body=homeHTML();
    else if(view==="schedule") body=`<div class="rowgrid">${weekPanel()}${railHTML()}</div>`;
    else if(view==="planner") body=`<div class="rowgrid">${dayPanel()}${dayRailHTML()}</div>`;
    else if(view==="notes") body=notesHTML();
    else{ const names={library:"Activity Library",bookings:"Community Bookings",staff:"Staff Assignments",transport:"Transportation",reports:"Reports & Print"}; body=stub(names[view]||"Section"); }
    const crumb = view!=="dashboard" ? `<button class="crumb" data-goto="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Dashboard</button>` : "";
    main.innerHTML=crumb+body;
    wire();
    if(view==="dashboard") hydrateHome();
  }

  function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1900);}
  function setNav(v){document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.nav===v));}

  function wire(){
    document.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>{cur=+el.dataset.day;view="planner";setNav("planner");render();});
    document.querySelectorAll("[data-wmode]").forEach(el=>el.onclick=()=>{weekMode=el.dataset.wmode;render();});
    document.querySelectorAll("[data-toast]").forEach(el=>el.onclick=()=>toast(el.dataset.toast));
    document.querySelectorAll("[data-add]").forEach(el=>el.onclick=()=>openAdd(el.dataset.add));
    document.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>{
      const dest=el.dataset.goto;
      if(dest==="planner"){window.location.href="/Day Hab/planner.html";return;}
      if(dest==="bookings"){window.location.href="/Day Hab/bookings.html";return;}
      if(dest==="library"){window.location.href="/Day Hab/activity-library.html";return;}
      view=dest;setNav(view);render();window.scrollTo(0,0);
    });
  }
  document.querySelectorAll("#nav a").forEach(a=>a.onclick=e=>{e.preventDefault();view=a.dataset.nav;setNav(view);render();});
  document.querySelectorAll(".topbar [data-goto]").forEach(el=>el.onclick=()=>{view=el.dataset.goto;render();window.scrollTo(0,0);});
  var _gt=document.getElementById("goToday"); if(_gt) _gt.onclick=()=>{cur=0;view="planner";setNav("planner");render();window.scrollTo(0,0);toast("Jumped to today’s planner");};

  const scrim=document.getElementById("scrim");
  function openAdd(kind){
    document.getElementById("mTitle").textContent=kind==="outing"?"Add outing":kind==="note"?"Add note":"Add activity";
    document.getElementById("f_day").innerHTML=DAYS.map((d,i)=>`<option value="${i}" ${i===cur?'selected':''}>${d.label} ${d.date}</option>`).join("");
    ["f_name","f_start","f_end","f_loc","f_ind","f_staff"].forEach(id=>document.getElementById(id).value="");
    scrim.classList.add("open");document.getElementById("f_name").focus();
  }
  document.getElementById("cancelBtn").onclick=()=>scrim.classList.remove("open");
  scrim.onclick=e=>{if(e.target===scrim)scrim.classList.remove("open");};
  document.getElementById("saveBtn").onclick=()=>{
    const name=document.getElementById("f_name").value.trim(); if(!name){document.getElementById("f_name").focus();return;}
    const di=+document.getElementById("f_day").value;
    (A[di]=A[di]||[]).push({prog:document.getElementById("f_prog").value,name,
      start:document.getElementById("f_start").value.trim()||"10:00",end:document.getElementById("f_end").value.trim()||"11:00",
      loc:document.getElementById("f_loc").value.trim()||"—",ind:document.getElementById("f_ind").value.trim()||"—",staff:document.getElementById("f_staff").value.trim()||"—"});
    scrim.classList.remove("open");cur=di;
    if(view!=="dashboard"&&view!=="planner"){view="dashboard";setNav("dashboard");}
    render();toast("Activity added");
  };

  render();
  paintBadge();
  resolveIdentityAsync();
})();
</script>
<script>
(function(){
  function tick(){
    var n=new Date();
    var dd=document.getElementById('clkD'), tt=document.getElementById('clkT');
    if(dd) dd.textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    if(tt) tt.textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }
  tick(); setInterval(tick,15000);
  document.querySelectorAll('.topbar [data-toast]').forEach(function(el){
    el.addEventListener('click',function(){
      var t=document.getElementById('toast'); if(!t)return;
      t.textContent=el.getAttribute('data-toast'); t.classList.add('show');
      clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1900);
    });
  });
})();
</script>
