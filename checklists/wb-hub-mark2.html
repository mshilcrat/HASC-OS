<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HASC — Checklists</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../wb-config.js"></script>
<script src="../wb-guard.js"></script>
<style>html,body{margin:0;min-height:100%;background:#f1efe9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#6a7a84;font-size:14px}</style>
</head>
<body>
<div class="loading">Opening Checklists…</div>
<script>
(async function(){
  function normalizedRole(value){
    return String(value||'').trim().toLowerCase().replace(/[\s-]+/g,'_');
  }

  let role=normalizedRole(sessionStorage.getItem('hasc_role'));

  try{
    if(!role&&window.supabase&&window.HASC_CONFIG){
      const client=window.__hascClient||window.supabase.createClient(
        window.HASC_CONFIG.SUPABASE_URL,
        window.HASC_CONFIG.SUPABASE_ANON_KEY
      );
      window.__hascClient=client;
      const sessionResult=await client.auth.getSession();
      const email=sessionResult?.data?.session?.user?.email||'';
      if(email){
        const profileResult=await client
          .from('profiles')
          .select('role')
          .eq('email',email)
          .maybeSingle();
        role=normalizedRole(profileResult?.data?.role);
        if(role)sessionStorage.setItem('hasc_role',role);
      }
    }
  }catch(error){
    console.warn('Checklist role lookup failed',error);
  }

  const managementRoles=new Set(['admin','administrator','ac','area_coordinator']);
  location.replace(managementRoles.has(role)
    ? 'wb-hub-AC-mark2.html'
    : 'wb-checkoff.html');
})();
</script>
</body>
</html>
