<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASC RM Compliance — Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="wb-config.js"></script>
<script src="wb-guard.js"></script>
  <script>
    if(window.supabase && window.HASC_CONFIG && !window.__hascClient){
      window.__hascClient = window.supabase.createClient(window.HASC_CONFIG.SUPABASE_URL, window.HASC_CONFIG.SUPABASE_ANON_KEY);
    }
  </script>
  
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#eef2f5; color:#223038;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .topbar { background:#fff; border-bottom:3px solid #17a2b8; display:flex; align-items:center; gap:16px; padding:12px 24px; flex-wrap:wrap; }
  .logo { font-weight:800; color:#17a2b8; letter-spacing:.5px; }
  .page-label { color:#8a97a1; font-size:15px; padding-left:14px; border-left:1px solid #e2e8ec; }
  .navbtns { display:flex; gap:9px; }
  .navbtn { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #dbe3e8; border-radius:9px; padding:7px 14px; font-size:14px; font-weight:600; color:#3a4a54; cursor:pointer; text-decoration:none; }
  .navbtn:hover { border-color:#17a2b8; color:#17a2b8; }
  .whoami { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .user-name { font-size:14px; color:#445561; }
  .container { max-width:1080px; margin:0 auto; padding:26px 24px 60px; }
  .callout { background:#fff; border-left:4px solid #17a2b8; border-radius:10px; padding:15px 20px; box-shadow:0 2px 8px rgba(34,48,56,.08); margin-bottom:22px; font-size:14px; color:#3a4a54; }
  .callout b { color:#223038; }
  .doc-label { font-size:11.5px; font-weight:700; letter-spacing:.9px; color:#9aa7b0; margin:0 0 12px 2px; }
  .sumbar { display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(34,48,56,.08); padding:16px 20px; flex:1; min-width:150px; }
  .stat .n { font-size:26px; font-weight:800; }
  .stat .l { font-size:13px; color:#7a8894; margin-top:2px; }
  .sec-head { margin:22px 2px 10px; font-size:13px; font-weight:700; color:#5b6b78; }
  .list { background:#fff; border-radius:14px; box-shadow:0 2px 8px rgba(34,48,56,.08); overflow:hidden; }
  .today-row { display:flex; align-items:center; gap:12px; padding:13px 20px; border-bottom:1px solid #f0f3f5; }
  .today-row:last-child { border-bottom:none; }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
  .t-status { margin-left:auto; font-size:13px; font-weight:600; }
  .empty { padding:26px 20px; color:#7a8894; font-size:14px; text-align:center; }
  .reset-note { margin-top:14px; font-size:12.5px; color:#9aa7b0; }

  .m2badge{display:inline-block;background:#0aa6b7;color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:6px;vertical-align:middle;margin-left:6px}
</style>
</head>
<body>
  <header class="topbar">
    <div class="logo">HASC CENTER</div> <span class="m2badge">MARK 2</span>
    <div class="page-label">Today</div>
    <div class="navbtns"><a class="navbtn" href="wb-hub-mark2.html">&#127968; Home</a></div>
    <div class="whoami"><div class="user-name" id="userName"></div></div>
  </header>
  <main class="container" id="view">
    <div class="callout"><b>Today</b> — which homes signed off today and which are still pending.</div>
    <div class="doc-label" id="dateLabel"></div>
    <div id="body"><div class="empty">Loading today’s status…</div></div>
  </main>
<script>
  function nycParts(){
    var f = new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true,weekday:'short'});
    var p={}; f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;}); return p;
  }
  function nycDateKey(){ var p=nycParts(); return p.year+"-"+p.month+"-"+p.day; }
  function nycDateLabel(){ var p=nycParts(); return p.weekday+", "+p.month+"/"+p.day+"/"+p.year+" \u00B7 "+p.hour+":"+p.minute+" "+p.dayPeriod+" ET"; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  document.getElementById("dateLabel").textContent = nycDateLabel();

  (async function(){
    var client = window.__hascClient;
    if(!client) return;
    try{
      var dayKey = nycDateKey();
      var homesR = await client.from("cl_homes").select("home_name,rm_email").order("home_name");
      var homes = (homesR.data||[]);
      // Submissions today (NY day). submitted_at stored UTC; compare via NY date on client.
      var subR = await client.from("cl_submissions").select("home_name,submitted_at");
      var signedToday = {};
      (subR.data||[]).forEach(function(s){
        var d = new Date(s.submitted_at);
        var nyKey = new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
        if(nyKey === dayKey) signedToday[s.home_name] = true;
      });
      var signed = homes.filter(function(h){ return signedToday[h.home_name]; });
      var pending = homes.filter(function(h){ return !signedToday[h.home_name]; });
      var h = '';
      h += '<div class="sumbar">'
        + '<div class="stat"><div class="n" style="color:#1a9d5a">'+signed.length+'</div><div class="l">Signed off today</div></div>'
        + '<div class="stat"><div class="n" style="color:#d64545">'+pending.length+'</div><div class="l">Still pending</div></div>'
        + '<div class="stat"><div class="n" style="color:#17a2b8">'+homes.length+'</div><div class="l">Total homes</div></div>'
        + '</div>';
      h += '<div class="sec-head">Still pending</div><div class="list">';
      if(!pending.length){ h += '<div class="empty">All homes have signed off today.</div>'; }
      pending.forEach(function(home){
        h += '<div class="today-row"><span class="dot" style="background:#d64545"></span><span>'+esc(home.home_name)+'</span><span class="t-status" style="color:#d64545">Pending</span></div>';
      });
      h += '</div>';
      h += '<div class="sec-head">Signed off</div><div class="list">';
      if(!signed.length){ h += '<div class="empty">No homes signed off yet today.</div>'; }
      signed.forEach(function(home){
        h += '<div class="today-row"><span class="dot" style="background:#1a9d5a"></span><span>'+esc(home.home_name)+'</span><span class="t-status" style="color:#1a9d5a">Signed</span></div>';
      });
      h += '</div>';
      h += '<div class="reset-note">Status is based on submissions for '+esc(dayKey)+' (New York time).</div>';
      document.getElementById("body").innerHTML = h;
    }catch(e){
      console.warn("[HASC today]", e);
      document.getElementById("body").innerHTML = '<div class="empty">Could not load today’s data.</div>';
    }
  })();
</script>
</body>
</html>
