<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASC — Documents</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wb-config.js"></script>
<script src="wb-guard.js"></script>
  <script>
    if(window.supabase && window.HASC_CONFIG && !window.__hascClient){
      window.__hascClient = window.supabase.createClient(window.HASC_CONFIG.SUPABASE_URL, window.HASC_CONFIG.SUPABASE_ANON_KEY);
    }
  </script>
  
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;background:#f7f8fa;color:#1a2b3c}
  header{background:#fff;border-bottom:3px solid #f2b705;padding:14px 22px;display:flex;align-items:center;gap:14px}
  header .logo{font-weight:800;color:#0aa6b7;letter-spacing:.5px}
  nav{background:#fff;border-bottom:1px solid #e5e8ec;padding:0 22px;display:flex;gap:22px}
  nav a{padding:14px 2px;color:#5a6b7c;text-decoration:none;font-size:15px;border-bottom:3px solid transparent}
  nav a.active{color:#0f7c8a;border-bottom-color:#0aa6b7;font-weight:600}
  main{max-width:1000px;margin:24px auto;padding:0 22px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#6b7a89;margin:0 0 22px;font-size:14px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e8ec;border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #eef1f4;font-size:14px}
  th{background:#fafbfc;color:#5a6b7c;font-weight:600}
  tr:last-child td{border-bottom:none}
  a.doc{color:#0f7c8a;text-decoration:none;font-weight:600}
  a.doc:hover{text-decoration:underline}
  .empty{background:#fff;border:1px solid #e5e8ec;border-radius:12px;padding:40px;text-align:center;color:#6b7a89}
  .loading{color:#6b7a89;padding:20px}
</style>
</head>
<body>
<header><span class="logo">HASC CENTER</span></header>
<nav>
  <a href="wb-hub-mark2.html">Home</a>
  <a href="wb-today-mark2.html">Today</a>
  <a href="wb-insights-mark2.html">Insights</a>
  <a href="wb-documents-mark2.html" class="active">Documents</a>
  <a href="wb-checklists-mark2.html">Checklists</a>
  <a href="wb-inbox-mark2.html">Inbox</a>
</nav>
<main>
  <h1>Documents</h1>
  <p class="sub">Files on record</p>
  <div id="wrap"><div class="loading">Loading…</div></div>
</main>
<script>
(async function(){
  const wrap=document.getElementById('wrap');
  try{
    const c = window.__hascClient;
    if(!c){wrap.innerHTML='<div class="empty">No data connection.</div>';return;}
    const {data,error} = await c.from('cl_documents').select('id,name,url,home_name,created_at').order('created_at',{ascending:false});
    if(error) throw error;
    if(!data || !data.length){wrap.innerHTML='<div class="empty">No documents on record yet.</div>';return;}
    const rows = data.map(d=>{
      const dt = d.created_at ? new Date(d.created_at).toLocaleDateString('en-US',{timeZone:'America/New_York'}) : '—';
      const nm = d.url ? '<a class="doc" href="'+d.url+'" target="_blank" rel="noopener">'+esc(d.name||'Untitled')+'</a>' : esc(d.name||'Untitled');
      return '<tr><td>'+nm+'</td><td>'+esc(d.home_name||'—')+'</td><td>'+dt+'</td></tr>';
    }).join('');
    wrap.innerHTML='<table><thead><tr><th>Document</th><th>Home</th><th>Added</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }catch(e){wrap.innerHTML='<div class="empty">Error: '+esc(e.message||String(e))+'</div>';}
  function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
})();
</script>
</body>
</html>
