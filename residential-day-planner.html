<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C5192">

<title>Residential Day Planner</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/wb-config.js"></script>
<script src="/wb-guard.js"></script>
<style>
:root{
  --violet:#7C5192;
  --plum:#AC659D;
  --teal:#17a2b8;
  --indigo:#5E6FB2;
  --green:#568E62;
  --blue:#3E9EB3;
  --gold:#D9B93B;
  --coral:#C96A44;
  --slate:#5b7a99;
  --jade:#3E9E86;
  --rose:#C67BA0;

  --ink:#233038;
  --muted:#6a7a84;
  --line:#e7e2d9;
  --card:#ffffff;
  --bg:#f7f4f1;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:
    "Plus Jakarta Sans",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}

button,
input,
select{
  font:inherit;
}

button{
  touch-action:manipulation;
}

#plannerApp{
  width:100%;
  min-height:100vh;
  padding:
    max(14px, env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
}

.planner-shell{
  width:100%;
  max-width:1500px;
  margin:0 auto;
}

.planner-top{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.wp-add{
  border:0;
  background:linear-gradient(135deg,var(--violet),var(--plum));
  color:#fff;
  min-height:42px;
  padding:9px 16px;
  border-radius:10px;
  font-weight:800;
  font-size:13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  box-shadow:0 2px 8px rgba(124,81,146,.35);
  white-space:nowrap;
}

.wp-add span{
  font-size:17px;
  line-height:1;
}

.divider{
  width:1px;
  height:28px;
  background:var(--line);
}

.view-switcher{
  display:flex;
  gap:4px;
  background:#efe9e1;
  padding:4px;
  border-radius:22px;
}

.wp-vbtn{
  border:0;
  min-height:36px;
  padding:7px 16px;
  border-radius:20px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  background:transparent;
  color:var(--muted);
}

.wp-vbtn.active{
  background:var(--violet);
  color:#fff;
}

.planner-nav{
  display:flex;
  gap:6px;
  align-items:center;
}

.wp-nav{
  border:1px solid var(--line);
  background:#fff;
  width:38px;
  height:38px;
  border-radius:9px;
  font-size:20px;
  line-height:1;
  font-weight:800;
  cursor:pointer;
  color:var(--ink);
}

.wp-today{
  border:1px solid var(--line);
  background:#fff;
  min-height:38px;
  padding:7px 14px;
  border-radius:8px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  color:var(--ink);
}

.planner-label{
  font-size:20px;
  font-weight:800;
}

.planner-hint{
  background:#fff7e0;
  border:1px solid var(--gold);
  color:#7a5c00;
  border-radius:10px;
  padding:8px 12px;
  font-size:13px;
  font-weight:600;
  margin-bottom:12px;
}

.calendar-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(35,48,56,.05);
}

.calendar-scroll{
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

/* ==============================
   DAY VIEW
============================== */

.day-grid{
  display:grid;
  grid-template-columns:70px 1fr;
}

.day-time-label{
  border-top:2px solid var(--line);
  padding:6px 8px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  text-align:right;
  background:#fff;
}

.day-hour{
  border-top:2px solid var(--line);
  border-left:1px solid var(--line);
}

.day-slot{
  min-height:27px;
  padding:1px 8px;
}

.day-slot + .day-slot{
  border-top:1px dashed #efe9e1;
}


/* ==============================
   DESKTOP 7 DAY WEEK
============================== */

.week-grid{
  display:grid;
  grid-template-columns:60px repeat(7,minmax(105px,1fr));
  min-width:820px;
}

.dow{
  padding:8px 4px;
  text-align:center;
  background:linear-gradient(135deg,var(--violet),var(--plum));
  color:#fff;
}

.dow-name{
  font-size:11px;
  letter-spacing:.06em;
  opacity:.85;
}

.dow-date{
  font-size:16px;
  font-weight:800;
}

.time-label{
  border-top:1px solid var(--line);
  padding:4px 6px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  text-align:right;
  background:#fff;
}

.wp-cell{
  position:relative;
}

.week-cell{
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
  padding:2px 3px;
  min-height:38px;
}

.week-cell.today{
  background:rgba(124,81,146,.055);
}


/* ==============================
   MOBILE 3 DAY WEEK
============================== */

.three-day-grid{
  display:grid;
  grid-template-columns:52px repeat(3,minmax(0,1fr));
  width:100%;
}

.three-day-grid .dow{
  min-width:0;
  padding:8px 2px;
}

.three-day-grid .dow-name{
  font-size:10px;
}

.three-day-grid .dow-date{
  font-size:17px;
}

.three-time-label{
  border-top:1px solid var(--line);
  padding:5px 4px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  text-align:right;
  background:#fff;
}

.three-cell{
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
  padding:2px;
  min-height:48px;
  min-width:0;
}

.three-cell.today{
  background:rgba(124,81,146,.055);
}


/* ==============================
   MONTH VIEW
============================== */

.month-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(110px,1fr));
  min-width:780px;
}

.month-head{
  padding:8px;
  font-size:11px;
  letter-spacing:.06em;
  color:#fff;
  font-weight:700;
  background:linear-gradient(135deg,var(--violet),var(--plum));
}

.month-cell{
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
  min-height:100px;
  padding:4px 5px;
  background:#fff;
}

.month-cell.other-month{
  background:#faf8f4;
  color:#c9c3b8;
}

.month-cell.today{
  background:rgba(124,81,146,.06);
}

.month-date{
  font-size:12px;
  font-weight:700;
  margin-bottom:3px;
}

.today-number{
  display:inline-block;
  background:var(--violet);
  color:#fff;
  border-radius:6px;
  padding:1px 6px;
}


/* ==============================
   APPOINTMENTS
============================== */

.wp-ev{
  border-radius:8px;
  padding:6px 7px;
  margin:2px 0;
  cursor:grab;
  touch-action:none;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
  font-size:12px;
  line-height:1.25;
  user-select:none;
  -webkit-user-select:none;
  overflow:hidden;
}

.wp-ev:active{
  cursor:grabbing;
}

.event-title{
  display:flex;
  align-items:center;
  gap:4px;
  font-weight:700;
  min-width:0;
}

.event-title span{
  overflow:hidden;
  text-overflow:ellipsis;
}

.event-time{
  font-size:10px;
  opacity:.92;
  margin-top:2px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.month-event{
  color:#fff;
  border-radius:6px;
  padding:3px 6px;
  margin:2px 0;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:grab;
  touch-action:none;
}

.more-events{
  font-size:11px;
  color:var(--violet);
  font-weight:700;
  margin-top:1px;
}

.drop-target{
  outline:2px dashed var(--violet);
  outline-offset:-2px;
  background:rgba(124,81,146,.09) !important;
}


/* ==============================
   TIME EDITOR
============================== */

#wpEditor{
  position:fixed;
  z-index:99999;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,.22);
  padding:14px 16px;
  width:280px;
}

.editor-title{
  font-weight:800;
  font-size:14px;
  color:var(--ink);
  margin-bottom:2px;
}

.editor-sub{
  font-size:12px;
  color:var(--muted);
  margin-bottom:10px;
}

.editor-time{
  display:flex;
  gap:6px;
  align-items:center;
  margin-bottom:12px;
}

.editor-time select{
  min-height:38px;
  padding:7px;
  border:1px solid var(--line);
  border-radius:8px;
  font-weight:700;
  background:#fff;
  min-width:0;
}

.editor-actions{
  display:flex;
  gap:8px;
}

.editor-save{
  flex:1;
  background:var(--violet);
  color:#fff;
  border:0;
  border-radius:8px;
  padding:9px;
  font-weight:700;
  cursor:pointer;
}

.editor-delete{
  background:#fdecec;
  color:#B42318;
  border:0;
  border-radius:8px;
  padding:9px 10px;
  font-weight:700;
  cursor:pointer;
}

.editor-cancel{
  background:#efe9e1;
  color:var(--ink);
  border:0;
  border-radius:8px;
  padding:9px 12px;
  font-weight:700;
  cursor:pointer;
}


/* ==============================
   NEW APPOINTMENT MODAL
============================== */

#wpNewModal{
  position:fixed;
  inset:0;
  z-index:100000;
  background:rgba(35,48,56,.42);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:
    max(28px,env(safe-area-inset-top))
    12px
    max(28px,env(safe-area-inset-bottom));
  overflow:auto;
}

.modal-card{
  background:#fff;
  border-radius:16px;
  width:440px;
  max-width:94vw;
  box-shadow:0 24px 70px rgba(0,0,0,.3);
  overflow:hidden;
}

.modal-head{
  background:linear-gradient(135deg,var(--violet),var(--plum));
  color:#fff;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:10px;
}

.modal-icon{
  font-size:20px;
}

.modal-title{
  font-size:17px;
  font-weight:800;
}

.modal-sub{
  font-size:12px;
  opacity:.9;
}

.modal-close{
  margin-left:auto;
  background:rgba(255,255,255,.2);
  border:0;
  color:#fff;
  width:36px;
  height:36px;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

.modal-body{
  padding:20px;
}

.field-label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin:0 0 4px;
}

.field{
  width:100%;
  min-height:42px;
  box-sizing:border-box;
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:16px;
  color:var(--ink);
  background:#fff;
}

.field-space{
  margin-bottom:14px;
}

.custom-wrap{
  display:none;
  background:#faf8f4;
  border:1px dashed var(--line);
  border-radius:10px;
  padding:12px;
  margin-bottom:14px;
}

.swatches{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.wpSw{
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer;
  box-shadow:0 0 0 1px var(--line);
}

.time-row{
  display:flex;
  gap:8px;
  margin-bottom:14px;
  align-items:center;
}

.time-row .field{
  min-width:0;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-save{
  flex:1;
  background:var(--violet);
  color:#fff;
  border:0;
  border-radius:10px;
  min-height:44px;
  padding:11px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.modal-cancel{
  background:#efe9e1;
  color:var(--ink);
  border:0;
  border-radius:10px;
  min-height:44px;
  padding:11px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.modal-error{
  color:var(--coral);
  font-size:12px;
  font-weight:700;
  margin-top:10px;
  display:none;
}


/* ==============================
   MOBILE / MARK 5
============================== */

@media(max-width:700px){

  #plannerApp{
    padding:
      max(9px,env(safe-area-inset-top))
      max(7px,env(safe-area-inset-right))
      max(12px,env(safe-area-inset-bottom))
      max(7px,env(safe-area-inset-left));
  }

  .planner-top{
    gap:7px;
  }

  .wp-add{
    order:1;
  }

  .view-switcher{
    order:2;
    flex:1;
    min-width:0;
  }

  .wp-vbtn{
    flex:1;
    padding:7px 8px;
  }

  .planner-nav{
    order:3;
  }

  .planner-label{
    order:4;
    width:100%;
    font-size:17px;
    padding-top:2px;
  }

  .divider{
    display:none;
  }

  .planner-hint{
    font-size:11px;
    padding:7px 9px;
    margin-bottom:8px;
  }

  .calendar-card{
    border-radius:10px;
  }

  .three-cell .wp-ev{
    padding:5px 4px;
    font-size:10px;
  }

  .three-cell .event-title{
    gap:2px;
  }

  .three-cell .event-time{
    font-size:9px;
  }

  .modal-body{
    padding:16px;
  }

  .modal-card{
    width:100%;
  }

  #wpNewModal{
    padding-top:max(10px,env(safe-area-inset-top));
  }

  #wpEditor{
    left:10px !important;
    right:10px !important;
    width:auto;
    max-width:none;
  }
}

@media(max-width:430px){

  .planner-nav{
    width:100%;
  }

  .wp-today{
    flex:1;
  }

  .wp-nav{
    width:44px;
    height:40px;
  }

  .three-day-grid{
    grid-template-columns:47px repeat(3,minmax(0,1fr));
  }

  .three-time-label{
    font-size:9px;
    padding-left:1px;
    padding-right:3px;
  }
}

@media(max-width:390px){

  .wp-add{
    width:100%;
    justify-content:center;
  }

  .view-switcher{
    width:100%;
    flex-basis:100%;
  }

  .modal-actions{
    flex-direction:column;
  }

  .modal-cancel{
    width:100%;
  }

  .time-row{
    gap:5px;
  }

  .three-day-grid{
    grid-template-columns:43px repeat(3,minmax(0,1fr));
  }

  .three-cell{
    min-height:46px;
  }
}
</style>
</head>
<body>

<main id="plannerApp">
<div class="planner-shell">
<div id="wowPlanner"></div>
</div>
</main>

<script>
(function(){

"use strict";

var STORAGE_KEY = "hasc.residential.dayplanner.v2";

var PAL = {
  violet:"#7C5192",
  plum:"#AC659D",
  teal:"#17a2b8",
  indigo:"#5E6FB2",
  green:"#568E62",
  blue:"#3E9EB3",
  gold:"#D9B93B",
  coral:"#C96A44",
  slate:"#5b7a99",
  jade:"#3E9E86",
  rose:"#C67BA0",
  ink:"#233038",
  muted:"#6a7a84",
  line:"#e7e2d9",
  card:"#fff"
};

var TYPES = {
  home:{c:PAL.indigo,ic:"🏠"},
  out:{c:PAL.blue,ic:"🚗"},
  med:{c:PAL.coral,ic:"🩺"},
  shop:{c:PAL.green,ic:"🛍"},
  rest:{c:PAL.coral,ic:"🍽"},
  fam:{c:PAL.plum,ic:"👥"},
  fun:{c:PAL.gold,ic:"🎉"}
};

var TYPE_LABELS = {
  home:"Home / Routine",
  out:"Outing / Transport",
  med:"Medical",
  shop:"Shopping",
  rest:"Meal / Dining",
  fam:"Family Visit",
  fun:"Recreation"
};

var SWATCHES = [
  PAL.violet,
  PAL.teal,
  PAL.coral,
  PAL.green,
  PAL.gold,
  PAL.blue,
  PAL.plum,
  PAL.rose,
  PAL.jade,
  PAL.slate,
  PAL.indigo,
  PAL.ink
];

var HOURS = [];
for(var h=7; h<=20; h++){
  HOURS.push(h);
}

var SLOTS = [0,15,30,45];

var TODAY = new Date();
TODAY.setHours(0,0,0,0);

var cursor = new Date();
cursor.setHours(0,0,0,0);

var view = "week";

var store = loadStore();

var wrap = document.getElementById("wowPlanner");

function isMobile(){
  return window.matchMedia("(max-width:700px)").matches;
}

function loadStore(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      /*
        Try the previous standalone planner key too,
        so replacing the code does not unnecessarily
        wipe anything previously entered.
      */
      raw = localStorage.getItem("hasc.residential.dayplanner.v1");
    }

    if(!raw){
      return [];
    }

    var data = JSON.parse(raw);

    return Array.isArray(data) ? data : [];

  }catch(e){
    console.warn("Day Planner load failed",e);
    return [];
  }
}

function saveStore(){
  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(store)
    );
  }catch(e){
    console.warn("Day Planner save failed",e);
  }
}

function pad(n){
  return String(n).padStart(2,"0");
}

function ymd(d){
  return (
    d.getFullYear()+
    "-"+
    pad(d.getMonth()+1)+
    "-"+
    pad(d.getDate())
  );
}

function parseYmd(s){
  var p=s.split("-");

  return new Date(
    Number(p[0]),
    Number(p[1])-1,
    Number(p[2])
  );
}

function sameDay(a,b){
  return (
    a.getFullYear()===b.getFullYear() &&
    a.getMonth()===b.getMonth() &&
    a.getDate()===b.getDate()
  );
}

function startOfWeek(d){
  var x=new Date(d);

  x.setDate(
    d.getDate()-d.getDay()
  );

  x.setHours(0,0,0,0);

  return x;
}

function addDays(d,n){
  var x=new Date(d);

  x.setDate(
    x.getDate()+n
  );

  return x;
}

function addMonths(d,n){
  var x=new Date(d);

  x.setMonth(
    x.getMonth()+n
  );

  return x;
}

function monthName(d){
  return (
    d.toLocaleString(
      "en-US",
      {month:"long"}
    )+
    " "+
    d.getFullYear()
  );
}

function evsOn(d){
  var k=ymd(d);

  return store.filter(function(e){
    return e.date===k;
  });
}

function esc(s){
  return String(
    s==null ? "" : s
  ).replace(
    /[&<>"]/g,
    function(c){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[c];
    }
  );
}

function typeOf(ev){

  if(ev.customColor){
    return {
      c:ev.customColor,
      ic:ev.customIcon || "★"
    };
  }

  return (
    TYPES[ev.type] ||
    {
      c:PAL.slate,
      ic:"•"
    }
  );
}

function fmt(h,m){

  h=Number(h);
  m=Number(m);

  var ap=h>=12 ? "PM" : "AM";

  var hh=h%12;

  if(hh===0){
    hh=12;
  }

  return (
    m>0
    ? hh+":"+pad(m)+" "+ap
    : hh+" "+ap
  );
}

function fmtShort(h,m){

  h=Number(h);
  m=Number(m);

  var ap=h>=12 ? "p" : "a";

  var hh=h%12;

  if(hh===0){
    hh=12;
  }

  return (
    m>0
    ? hh+":"+pad(m)+ap
    : hh+ap
  );
}

function pill(ev,showTime){

  var t=typeOf(ev);

  var time=fmt(
    ev.hour,
    ev.min
  );

  var unst=/unassigned|unstaff/i.test(
    ev.who || ""
  );

  var style;

  if(unst){

/* ===================================
   DAY
=================================== */

function renderDay(){

  var d=cursor;
  var evs=evsOn(d);

  var out=
    '<div class="day-grid">';

  HOURS.forEach(function(hr){

    out+=
      '<div class="day-time-label">'+
        fmt(hr,0)+
      '</div>';

    out+=
      '<div class="day-hour">';

    SLOTS.forEach(function(mn){

      var inSlot=
        evs
        .filter(function(e){
          return (
            Number(e.hour)===hr &&
            Number(e.min)>=mn &&
            Number(e.min)<mn+15
          );
        })
        .sort(function(a,b){
          return Number(a.min)-Number(b.min);
        });

      out+=
        '<div '+
          'class="wp-cell day-slot" '+
          'data-ymd="'+ymd(d)+'" '+
          'data-hour="'+hr+'" '+
          'data-min="'+mn+'">'+

          inSlot
          .map(function(e){
            return pill(e,true);
          })
          .join("")+

        '</div>';
    });

    out+='</div>';
  });

  out+='</div>';

  return out;
}


/* ===================================
   DESKTOP 7 DAY WEEK
=================================== */

function renderSevenDayWeek(){

  var sow=startOfWeek(cursor);

  var days=[];

  for(var i=0;i<7;i++){
    days.push(
      addDays(sow,i)
    );
  }

  var DOW=[
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT"
  ];

  var out=
    '<div class="calendar-scroll">'+
    '<div class="week-grid">'+
    '<div></div>';

  days.forEach(function(d,i){

    var today=sameDay(
      d,
      TODAY
    );

    out+=
      '<div class="dow">'+
        '<div class="dow-name">'+
          DOW[i]+
        '</div>'+
        '<div class="dow-date">'+
          d.getDate()+
          (
            today
            ? " •"
            : ""
          )+
        '</div>'+
      '</div>';
  });

  HOURS.forEach(function(hr){

    out+=
      '<div class="time-label">'+
        fmt(hr,0)+
      '</div>';

    days.forEach(function(d){

      var today=sameDay(
        d,
        TODAY
      );

      var inC=
        evsOn(d)
        .filter(function(e){
          return Number(e.hour)===hr;
        })
        .sort(function(a,b){
          return Number(a.min)-Number(b.min);
        });

      out+=
        '<div '+
          'class="wp-cell week-cell'+
            (
              today
              ? " today"
              : ""
            )+
          '" '+
          'data-ymd="'+ymd(d)+'" '+
          'data-hour="'+hr+'" '+
          'data-min="0">'+

          inC
          .map(function(e){
            return pill(e,true);
          })
          .join("")+

        '</div>';
    });
  });

  out+=
    '</div>'+
    '</div>';

  return out;
}


/* ===================================
   PHONE GOOGLE-STYLE 3 DAY WEEK
=================================== */

function renderThreeDayWeek(){

  /*
    On mobile, cursor represents the FIRST visible day.

    Example:
    Monday | Tuesday | Wednesday

    Press next:
    Thursday | Friday | Saturday

    This intentionally behaves like a 3-day mobile
    calendar instead of squeezing 7 days onto the screen.
  */

  var days=[

    addDays(cursor,1),
    addDays(cursor,2)
  ];

  var out=
    '<div class="three-day-grid">'+
    '<div></div>';

  days.forEach(function(d){

    var today=sameDay(
      d,
      TODAY
    );

    out+=
      '<div class="dow">'+
        '<div class="dow-name">'+
          d.toLocaleDateString(
            "en-US",
            {weekday:"short"}
          ).toUpperCase()+
        '</div>'+
        '<div class="dow-date">'+
          d.getDate()+
          (
            today
            ? " •"
            : ""
          )+
        '</div>'+
      '</div>';
  });

  HOURS.forEach(function(hr){

    out+=
      '<div class="three-time-label">'+
        fmtShort(hr,0)+
      '</div>';

    days.forEach(function(d){

      var today=sameDay(
        d,
        TODAY
      );

      var inC=
        evsOn(d)
        .filter(function(e){
          return Number(e.hour)===hr;
        })
        .sort(function(a,b){
          return Number(a.min)-Number(b.min);
        });

      out+=
        '<div '+
          'class="wp-cell three-cell'+
            (
              today
              ? " today"
              : ""
            )+
          '" '+
          'data-ymd="'+ymd(d)+'" '+
          'data-hour="'+hr+'" '+

          .map(function(e){
            return pill(e,true);
          })
          .join("")+

        '</div>';
    });
  });

  out+='</div>';

  return out;
}

function renderWeek(){

  if(isMobile()){
    return renderThreeDayWeek();
  }

  return renderSevenDayWeek();
}


/* ===================================
   MONTH
=================================== */

function renderMonth(){

  var y=cursor.getFullYear();
  var m=cursor.getMonth();

  var first=new Date(
    y,
    m,
    1
  );

  var startCell=
    addDays(
      first,
      -first.getDay()
    );

  var names=[
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT"
  ];

  var out=
    '<div class="calendar-scroll">'+
    '<div class="month-grid">';

  names.forEach(function(d){
    out+=
      '<div class="month-head">'+
        d+
      '</div>';
  });

  for(var c=0;c<42;c++){

    var cd=
      addDays(
        startCell,
        c
      );

    var inMonth=
      cd.getMonth()===m;

    var isToday=
      sameDay(
        cd,
        TODAY
      );

    var evs=
      evsOn(cd)
      .sort(function(a,b){
        return (
          (
            Number(a.hour)*60+
            Number(a.min)
          )
          -
          (
            Number(b.hour)*60+
            Number(b.min)
          )
        );
      });

    var show=
      evs.slice(0,4);

    var extra=
      evs.length-
      show.length;

    out+=
      '<div '+
        'class="wp-cell month-cell'+
          (
            inMonth
            ? ""
            : " other-month"
          )+
          (
            isToday
            ? " today"
            : ""
          )+
        '" '+
        'data-ymd="'+ymd(cd)+'" '+
        'data-kind="month">'+

        '<div class="month-date">'+
          (
            isToday
            ?
            '<span class="today-number">'+
              cd.getDate()+
            '</span>'
            :
            cd.getDate()
          )+
        '</div>';

    show.forEach(function(e){

      var t=typeOf(e);

      out+=
        '<div '+
          'class="wp-ev month-event" '+
          'data-id="'+esc(e.id)+'" '+
          'title="'+
            esc(e.title)+
            " — "+
            fmt(e.hour,e.min)+
          '" '+
          'style="background:'+t.c+';">'+

          '<b>'+
            fmtShort(
              e.hour,
              e.min
            )+
          '</b> '+
          esc(e.title)+

        '</div>';
    });

    if(extra>0){
      out+=
        '<div class="more-events">'+
          '+'+extra+' more'+
        '</div>';
    }

    out+='</div>';
  }

  out+=
    '</div>'+
    '</div>';

  return out;
}


/* ===================================
   HEADER LABEL
=================================== */

function label(){

  if(view==="day"){

    return cursor.toLocaleDateString(
      "en-US",
      {
        weekday:"short",
        month:"short",
        day:"numeric",
        year:"numeric"
      }
    );
  }

  if(view==="week"){

    if(isMobile()){

      var end=
        addDays(
          cursor,
          2
        );

      if(
        cursor.getMonth()===
        end.getMonth()
      ){

        return (
          cursor.toLocaleDateString(
            "en-US",
            {
              month:"short",
              day:"numeric"
            }
          )+
          " – "+
          end.getDate()+
          ", "+
          end.getFullYear()
        );
      }

      return (
        cursor.toLocaleDateString(
          "en-US",
          {
            month:"short",
            day:"numeric"
          }
        )+
        " – "+
        end.toLocaleDateString(
          "en-US",
          {
            month:"short",
            day:"numeric",
            year:"numeric"
          }
        )
      );
    }

    var s=startOfWeek(cursor);
    var e=addDays(s,6);

    return (
      "Week of "+
      s.toLocaleDateString(
        "en-US",
        {
          month:"short",
          day:"numeric"
        }
      )+
      " – "+
      e.toLocaleDateString(
        "en-US",
        {
          month:"short",
          day:"numeric",
          year:"numeric"
        }
      )
    );
  }

  return monthName(cursor);
}

/* ===================================
   NAVIGATION
=================================== */

function step(n){

  if(view==="day"){

    cursor=
      addDays(
        cursor,
        n
      );

  }else if(view==="week"){

    if(isMobile()){

      /*
        Each arrow movement shows the NEXT THREE DAYS.
      */
      cursor=
        addDays(
          cursor,
          n*3
        );

    }else{

      cursor=
        addDays(
          cursor,
          n*7
        );
    }

  }else{

    cursor=
      addMonths(
        cursor,
        n
      );
  }

  paint();
}


/* ===================================
   EVENT HELPERS
=================================== */

function findEvent(id){

  return store.find(function(x){
    return String(x.id)===String(id);
  });
}

function removeNode(id){

  var el=
    document.getElementById(id);

  if(el){
    el.remove();
  }
}

function hopt(sel){

  var s="";

  for(var n=1;n<=12;n++){

    s+=
      '<option value="'+n+'"'+
      (
        n===sel
        ? " selected"
        : ""
      )+
      '>'+
      n+
      '</option>';
  }

  return s;
}

function mopt(sel){

  var arr=[
    0,
    5,
    10,
    15,
    20,
    25,
    30,
    35,
    40,
    45,
    50,
    55
  ];

  var s="";

  arr.forEach(function(n){

    s+=
      '<option value="'+n+'"'+
      (
        n===sel
        ? " selected"
        : ""
      )+
      '>'+
      pad(n)+
      '</option>';
  });

  return s;
}


/* ===================================
   EDIT APPOINTMENT
=================================== */

function openEditor(id,anchor){

  var ev=findEvent(id);

  if(!ev){
    return;
  }

  removeNode("wpEditor");

  var box=
    document.createElement("div");

  box.id="wpEditor";

  var r=
    anchor.getBoundingClientRect();

  var left=
    Math.max(
      10,
      Math.min(
        r.left,
        window.innerWidth-300
      )
    );

  var top=
    Math.max(
      10,
      Math.min(
        r.bottom+6,
        window.innerHeight-240
      )
    );

  box.style.left=
    left+"px";

  box.style.top=
    top+"px";

  var hour24=
    Number(ev.hour);

  var hh=
    hour24%12;

  if(hh===0){
    hh=12;
  }

  var ap=
    hour24>=12
    ? "PM"
    : "AM";

  box.innerHTML=

    '<div class="editor-title">'+
      esc(ev.title)+
    '</div>'+

    '<div class="editor-sub">'+
      'Set the exact start time'+
    '</div>'+

    '<div class="editor-time">'+

      '<select id="wpH">'+
        hopt(hh)+
      '</select>'+

      '<strong>:</strong>'+

      '<select id="wpM">'+
        mopt(Number(ev.min))+
      '</select>'+

      '<select id="wpAP">'+

        '<option'+
          (
            ap==="AM"
            ? " selected"
            : ""
          )+
        '>AM</option>'+

        '<option'+
          (
            ap==="PM"
            ? " selected"
            : ""
          )+
        '>PM</option>'+

      '</select>'+

    '</div>'+

    '<div class="editor-actions">'+

      '<button id="wpSave" class="editor-save" type="button">'+
        'Save'+
      '</button>'+

      '<button id="wpDelete" class="editor-delete" type="button">'+
        'Delete'+
      '</button>'+

      '<button id="wpCancel" class="editor-cancel" type="button">'+
        'Cancel'+
      '</button>'+

    '</div>';

  document.body.appendChild(box);

  box.querySelector(
    "#wpCancel"
  ).onclick=function(){
    box.remove();
  };

  box.querySelector(
    "#wpDelete"
  ).onclick=function(){

    if(
      confirm(
        'Delete "'+
        ev.title+
        '"?'
      )
    ){

      store=
        store.filter(function(x){
          return String(x.id)!==String(ev.id);
        });

      saveStore();

      box.remove();

      paint();
    }
  };

  box.querySelector(
    "#wpSave"
  ).onclick=function(){

    var H=
      Number(
        box.querySelector(
          "#wpH"
        ).value
      );

    var M=
      Number(
        box.querySelector(
          "#wpM"
        ).value
      );

    var A=
      box.querySelector(
        "#wpAP"
      ).value;

    if(
      A==="PM" &&
      H!==12
    ){
      H+=12;
    }

    if(
      A==="AM" &&
      H===12
    ){
      H=0;
    }

    ev.hour=H;
    ev.min=M;

    saveStore();

    box.remove();

    paint();
  };

  setTimeout(function(){

    function outside(e){

      if(
        !box.contains(e.target)
      ){

        box.remove();

        document.removeEventListener(
          "pointerdown",
          outside
        );
      }
    }

    document.addEventListener(
      "pointerdown",
      outside
    );

  },0);
}

        ).value;

      if(
        A==="PM" &&
        H!==12
      ){
        H+=12;
      }

      if(
        A==="AM" &&
        H===12
      ){
        H=0;
      }

      var who=
        back.querySelector(
          "#wpNWho"
        ).value.trim() ||
        "Unassigned";

      var rec={
        id:
          "n"+
          Date.now()+
          Math.random()
          .toString(36)
          .slice(2,6),

        title:title,
        date:dv,
        hour:H,
        min:M,
        who:who
      };

      if(
        typ==="__custom"
      ){

        var cn=
          back.querySelector(
            "#wpNCustom"
          ).value.trim();

        if(!cn){

          err.textContent=
            "Please name your custom type.";

          err.style.display=
            "block";

          return;
        }

        rec.type=
          "custom";

        rec.customLabel=
          cn;

        rec.customColor=
          picked;

        rec.customIcon=
          "★";

      }else{

        rec.type=
          typ;
      }

      store.push(
        rec
      );

      saveStore();

      cursor=
        parseYmd(dv);

      close();

      paint();
    };
}


/* ===================================
   DRAG / TOUCH
=================================== */

var drag=null;

function clearDropTarget(){

  document.querySelectorAll(
    ".drop-target"
  ).forEach(function(el){

    el.classList.remove(
      "drop-target"
    );
  });
}

function applyDrop(id,cell){

  var rec=
    findEvent(id);

  if(
    !rec ||
    !cell
  ){
    return;
  }

  var y=
    cell.getAttribute(
      "data-ymd"
    );

  if(y){
    rec.date=y;
  }

  var hh=
    cell.getAttribute(
      "data-hour"
    );

  if(
    hh!==null &&
    hh!==""
  ){
    rec.hour=
      Number(hh);
  }

  var mm=
    cell.getAttribute(
      "data-min"
    );

  if(
    mm!==null &&
    mm!==""
  ){
    rec.min=
      Number(mm);
  }

  saveStore();

  paint();
}

function onDown(e){

  var pl=
    e.target.closest(
      ".wp-ev"
    );

  if(
    !pl ||
    !wrap.contains(pl)
  ){
    return;
  }

  if(
    e.button!==undefined &&
    e.button!==0
  ){
    return;
  }

  drag={
    id:
      pl.getAttribute(
        "data-id"
      ),

    sx:e.clientX,
    sy:e.clientY,
    moved:false,
    ghost:null,
    src:pl,
    lastCell:null
  };

  try{
    pl.setPointerCapture(
      e.pointerId
    );
  }catch(ignore){}

  e.preventDefault();
}

function onMove(e){

  if(!drag){
    return;
  }

  var dx=
    e.clientX-
    drag.sx;

  var dy=
    e.clientY-
    drag.sy;

  if(
    !drag.moved &&
    Math.abs(dx)+
    Math.abs(dy)<7
  ){
    return;
  }

  if(!drag.moved){

    drag.moved=true;

    var g=
      drag.src.cloneNode(
        true
      );

    g.style.position=
      "fixed";

    g.style.pointerEvents=
      "none";

    g.style.zIndex=
      "100001";

    g.style.width=
      drag.src.offsetWidth+
      "px";

    g.style.opacity=
      ".92";

    g.style.transform=
      "scale(1.04)";

    g.style.boxShadow=
      "0 8px 24px rgba(0,0,0,.28)";

    document.body.appendChild(
      g
    );

    drag.ghost=g;

    drag.src.style.opacity=
      ".35";
  }

  if(!drag.ghost){
    return;
  }

  drag.ghost.style.left=
    e.clientX+8+"px";

  drag.ghost.style.top=
    e.clientY+8+"px";

  clearDropTarget();

  drag.ghost.style.display=
    "none";

  var el=
    document.elementFromPoint(
      e.clientX,
      e.clientY
    );

  drag.ghost.style.display=
    "";

  var cell=
    el
    ? el.closest(
        ".wp-cell"
      )
    : null;

  if(cell){

    cell.classList.add(
      "drop-target"
    );

    drag.lastCell=
      cell;
  }

  e.preventDefault();
}

function onUp(e){

  if(!drag){
    return;
  }

  var state=
    drag;

  drag=null;

  if(state.ghost){
    state.ghost.remove();
  }

  if(state.src){
    state.src.style.opacity="1";
  }

  clearDropTarget();

  if(state.moved){

    var el=
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    var cell=
      el
      ? el.closest(
          ".wp-cell"
        )
      : null;

    if(!cell){
      cell=state.lastCell;
    }

    if(cell){

      applyDrop(
        state.id,
        cell
      );
    }

  }else{

    openEditor(
      state.id,
      state.src
    );
  }
}


/* ===================================
   BUTTON WIRING
=================================== */

function wire(){

  var ab=
    wrap.querySelector(
      ".wp-add"
    );

  if(ab){
    ab.onclick=openNew;
  }

  wrap.querySelectorAll(
    ".wp-vbtn"
  ).forEach(function(b){

    b.onclick=
      function(){

        view=
          b.getAttribute(
            "data-v"
          );

        /*
          When mobile enters 3-day mode,
          start with today/current cursor.
        */
        paint();
      };
  });

  wrap.querySelectorAll(
    ".wp-nav"
  ).forEach(function(b){

    b.onclick=
      function(){

        step(
          Number(
            b.getAttribute(
              "data-dir"
            )
          )
        );
      };
  });

  var todayBtn=
    wrap.querySelector(
      ".wp-today"
    );

  if(todayBtn){

    todayBtn.onclick=
      function(){

        cursor=
          new Date(TODAY);

        paint();
      };
  }
}


/* ===================================
   SCREEN SIZE CHANGE
=================================== */

var lastMobile=isMobile();

window.addEventListener(
  "resize",
  function(){

    var nowMobile=isMobile();

    if(nowMobile!==lastMobile){

      lastMobile=nowMobile;

      /*
        Repaint automatically if rotating the phone
        or opening the same planner on desktop.
      */
      paint();
    }
  }
);


/* ===================================
   POINTER EVENTS
=================================== */

document.addEventListener(
  "pointerdown",
  function(e){

    if(
      wrap &&
      wrap.contains(e.target)
    ){

      onDown(e);
    }
  }
);

document.addEventListener(
  "pointermove",
  onMove,
  {passive:false}
);

document.addEventListener(
  "pointerup",
  onUp
);

document.addEventListener(
  "pointercancel",
  onUp
);

paint();
if (typeof window.setMutationUIEnabled === "function") { try{ window.setMutationUIEnabled(false); }catch(e){} }
if (window.__RDP.__ready) { try{ window.__RDP.boot(); }catch(e){} }

})();
</script>

<script>
