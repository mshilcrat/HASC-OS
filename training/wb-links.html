<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASC – Training Links</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f4f7;color:#1f2937;min-height:100vh}
  .header{background:#fff;border-bottom:3px sholid #16b3c6;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .header img{height:34px}
  .header .title{font-weight:700;font-size:16px;color:#0f172a}
  .header .nav{display:flex;gap:8px;margin-left:auto;align-items:center}
  .header .nav a{font-size:13px;color:#475569;text-decoration:none;border:1px solid #cbd5e1;border-radius:8px;padding:5px 11px}
  .header .nav a:hover{background:#f1f5f9}
  .wrap{max-width:920px;margin:0 auto;padding:26px 18px}
  .card{background:#fff;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.06);padding:22px;border:1px solid #eef2f6}
  .card h2{font-size:18px;margin-bottom:4px}
  .card .sub{font-size:13px;color:#64748b;margin-bottom:18px}
  .add-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:12px;align-items:end;background:#f8fafc;border:1px solid #eef2f6;border-radius:12px;padding:16px;margin-bottom:18px}
  .add-row label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:#64748b;margin-bottom:5px;text-transform:uppercase}
  .add-row input{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:9px;font-size:14px}
  .add-row input:focus{outline:none;border-color:#16b3c6;box-shadow:0 0 0 3px rgba(22,179,198,.15)}
  .btn-add{background:#16b3c6;color:#fff;border:none;border-radius:9hpx;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-add:hover{background:#1296a6}
  .item{border:1px solid #eef2f6;border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .item .info{flex:1;min-width:200px}
  .item .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .pill{background:#dcfce7;color:#166534;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
  .pill.warn{background:#fef3c7;color:#92400e}
  .item .url{font-size:12px;color:#64748b;margin-top:3px;word-break:break-all}
  .item .added{font-size:11px;color:#94a3b8;margin-top:3px}
  .item .acts{display:flex;gap:8px}
  .ibtn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:#334155}
  .ibtn:hover{background:#f1f5f9}
  .ibtn.del{padding:7px 10px}
  .foot{font-size:12px;color:#94a3b8;margin-top:6px}
  .empty{text-align:center;color:#94a3b8;padding:26px;font-size:14px}
  @media(max-width:640px){.add-row{grid-template-columns:1fr}.btn-add{width:100%}}
</style>
</head>
<body>
<div class="header">
  <img src="/hasc-logo.png" alt="HASC Center">
  <span class="title">Training Links</span>
  <span class="nav">
    <a href="javascript:history.back()">← Back</a>
    <a href="wb-index.html">🏠 Home</a>
  </span>
</div>
<div class="wrap">
  <div class="card">
    <h2>Training Links Library</h2>
    <p class="sub">Saved training links so RMs can grab them without hunting.</p>
    <div class="add-row">
      <div>
        <label for="lname">Name this training</label>
        <input id="lname" placeholder="e.g. Fire safety annual">
      </div>
      <div>
        <label for="lurl">Training URL</label>
        <input id="lurl" placeholder="https://...">
      </div>
      <button class="btn-add" id="addBtn">+ Add</button>
    </div>
    <div id="list"></div>
    <div class="foot" id="foot">0 saved · stored on this browser</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../wb-config.js"></script>
<script>
(function(){
  var sb = supabase.createClient(HASC_CONFIG.SUPABASE_URL, HASC_CONFIG.SUPABASE_ANON_KEY);
  var HIDE_KEY = 'hasc_training_links_hidden';
  var TZ = 'America/New_York';
  var listEl = document.getElementById('list');
  var footEl = document.getElementById('foot');
  var rows = [];
  var sessResidence = {};            // session_token -> residence
  function tokenOf(u){ try{ var m = String(u||'').match(/[?&]token=([^&#]+)/); return m ? decodeURIComponent(m[1]) : ''; }catch(e){ return ''; } }
  function myRole(){ return (sessionStorage.getItem('hasc_role')||'').toLowerCase(); }
  function myHomes(){ try{ return JSON.parse(sessionStorage.getItem('hasc_homes')||'[]')||[]; }catch(e){ return []; } }
  function canSee(r){
    if (myRole() === 'admin') return true;               // admins see everything
    var res = sessResidence[tokenOf(r.url)];
    if (!res) return true;                                // no matching session -> show to all
    var homes = myHomes();
    for (var i=0;i<homes.length;i++){ if (String(homes[i]).trim() === String(res).trim()) return true; }
    return false;
  }
  function hiddenIds(){ try { return JSON.parse(localStorage.getItem(HIDE_KEY) || '[]'); } catch(e){ return []; } }
  function hideLocally(id){ var h = hiddenIds(); if (h.indexOf(id) === -1){ h.push(id); localStorage.setItem(HIDE_KEY, JSON.stringify(h)); } }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function nycYMD(v){ var dt = new Date(v); if (isNaN(dt)) return null; var parts = new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric'}).formatToParts(dt); var o = {}; parts.forEach(function(p){ o[p.type] = p.value; }); return { y:+o.year, m:+o.month, d:+o.day }; }
  function fmtDate(v){ var c = nycYMD(v); if(!c) return ''; return c.m + '/' + c.d + '/' + String(c.y).slice(-2); }
  function ageLabel(v){ var s = nycYMD(v); if(!s) return ''; var n = nycYMD(new Date()); var sD = new Date(s.y, s.m-1, s.d), nD = new Date(n.y, n.m-1, n.d); var dayDiff = Math.round((nD - sD)/86400000); if (dayDiff <= 0) return 'Day 1'; var months = (n.y - s.y)*12 + (n.m - s.m); if (n.d < s.d) months -= 1; if (months < 1) return 'Day ' + (dayDiff + 1); if (months < 12) return months + (months===1?' month':' months'); var years = Math.floor(months/12), rem = months%12; var l = years + (years===1?' year':' years'); if (rem > 0) l += ', ' + rem + (rem===1?' month':' months'); return l; }
  function badge(v){ return fmtDate(v) + ' · ' + ageLabel(v); }
  function render(){
    var hide = hiddenIds();
    var visible = rows.filter(function(r){ return hide.indexOf(r.id) === -1 && canSee(r); });
    if (visible.length === 0){ listEl.innerHTML = '<div class="empty">No saved links yet.</div>'; }
    else {
      listEl.innerHTML = visible.map(function(r){
        return '<div class="item"><div class="info"><div class="name">' + esc(r.name) + ' <span class="pill">' + esc(badge(r.created_at)) + '</span></div><div class="url">' + esc(r.url) + '</div></div><div class="acts"><button class="ibtn" data-act="copy" data-id="' + esc(r.id) + '">📋 Copy</button><button class="ibtn" data-act="open" data-id="' + esc(r.id) + '">↗ Open</button><button class="ibtn del" data-act="del" data-id="' + esc(r.id) + '">🗑</button></div></div>';
      }).join('');
    }
    footEl.textContent = visible.length + ' saved · synced from Supabase';
  }
  function byId(id){ for(var i=0;i<rows.length;i++){ if(String(rows[i].id)===String(id)) return rows[i]; } return null; }
  listEl.addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]'); if(!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id'), r = byId(id); if(!r) return;
    if(act === 'copy'){ navigator.clipboard.writeText(r.url).then(function(){ var t = b.textContent; b.textContent = '✓ Copied'; setTimeout(function(){ b.textContent = t; }, 1200); }); }
    else if(act === 'open'){ window.open(r.url, '_blank'); }
    else if(act === 'del'){ hideLocally(id); render(); }
  });
  function addLink(){
    var name = (document.getElementById('lname').value || '').trim();
    var url  = (document.getElementById('lurl').value || '').trim();
    if(!name || !url){ return; }
    var id = 'l' + Date.now() + Math.random().toString(36).slice(2,7);
    sb.from('training_links').insert({ id: id, name: name, url: url }).then(function(res){
      if(res.error){ alert('Could not save link: ' + res.error.message); return; }
      document.getElementById('lname').value = ''; document.getElementById('lurl').value = ''; load();
    });
  }
  document.getElementById('addBtn').addEventListener('click', addLink);
  function load(){
    footEl.textContent = 'Loading…';
    sb.from('training_links').select('id,name,url,created_at').order('created_at',{ascending:false}).then(function(res){
      if(res.error){ footEl.textContent = 'Error loading links'; listEl.innerHTML = '<div class="empty">Could not load links.</div>'; return; }
      rows = res.data || [];
      sb.from('training_sessions').select('session_token,residence').then(function(sr){
        sessResidence = {};
        if (sr && sr.data){ sr.data.forEach(function(s){ if(s.session_token) sessResidence[s.session_token] = s.residence; }); }
        render();
      });
    });
  }
  load();
})();
</script>

</body>
</html>
